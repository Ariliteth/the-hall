<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taco Science</title>
  <style>
    :root {
      --lab-white:  #f4f2ed;
      --lab-warm:   #faf8f3;
      --surface:    #ffffff;
      --grid:       rgba(180,175,160,0.18);
      --ink:        #2a2520;
      --dim:        rgba(42,37,32,0.45);
      --accent:     #e8700a;
      --teal:       #1a8a7a;
      --paprika:    #c03028;
      --sage:       #4a9a52;
      --border:     rgba(42,37,32,0.12);
      --shadow:     rgba(42,37,32,0.06);
      --glow:       rgba(232,112,10,0.15);
      --metal-bg:   #d8d8dc;
      --metal-bdr:  #a0a0a8;
      --plastic-bg: #fff8ee;
      --plastic-bdr:#e89030;
      --bedazzle-bg:#f4eef8;
      --bedazzle-bdr:#b878d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--lab-white);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── Header ──────────────────────────────────────────── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      flex-shrink: 0;
      box-shadow: 0 1px 4px var(--shadow);
    }
    #header h1 {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    #day-badge {
      font-size: 12px;
      color: var(--dim);
      background: var(--lab-warm);
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    /* ── Main bench area ─────────────────────────────────── */
    #bench {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--dim);
      margin-bottom: 4px;
    }

    /* ── Troughs ─────────────────────────────────────────── */
    #trough-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .trough {
      width: 90px;
      height: 80px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: default;
      transition: box-shadow 0.2s;
      position: relative;
    }
    .trough.metal {
      background: var(--metal-bg);
      border: 2px solid var(--metal-bdr);
    }
    .trough.plastic {
      background: var(--plastic-bg);
      border: 2px dashed var(--plastic-bdr);
    }
    .trough.bedazzled {
      background: var(--bedazzle-bg);
      border: 2px solid var(--bedazzle-bdr);
      box-shadow: inset 0 0 12px rgba(184,120,208,0.12);
    }
    .trough.hover {
      box-shadow: 0 0 12px var(--glow), 0 0 0 2px var(--accent);
    }
    .trough-material {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      position: absolute;
      bottom: 4px;
    }
    .trough-content { font-size: 24px; line-height: 1; }
    .trough-code { font-size: 10px; font-weight: bold; color: var(--ink); }
    .trough-empty { font-size: 20px; color: rgba(42,37,32,0.15); }
    .trough-clear {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 10px;
      color: var(--dim);
      cursor: pointer;
      display: none;
    }
    .trough.filled .trough-clear { display: block; }

    /* ── Recipe Card Workspace ────────────────────────────── */
    #recipe-workspace {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    #recipe-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .recipe-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .recipe-row label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      width: 60px;
      flex-shrink: 0;
    }
    .recipe-row select {
      background: var(--lab-warm);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    /* Layers display */
    #layer-slots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 36px;
      align-items: center;
    }
    .layer-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .layer-chip:hover { opacity: 0.7; }
    .layer-chip .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .layer-num { font-size: 9px; color: var(--dim); margin-right: 2px; }
    .layer-placeholder {
      font-size: 11px;
      color: rgba(42,37,32,0.25);
      font-style: italic;
    }

    /* Vessel stats */
    #vessel-stats {
      font-size: 10px;
      color: var(--dim);
      display: flex;
      gap: 12px;
    }
    #vessel-stats span { white-space: nowrap; }
    .stat-val { color: var(--accent); font-weight: bold; }

    /* Buttons */
    .btn {
      background: var(--lab-warm);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--glow); border-color: var(--accent); }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .btn:disabled:hover { background: var(--lab-warm); border-color: var(--border); }
    .btn-submit { background: rgba(26,138,122,0.1); border-color: var(--teal); color: var(--teal); }
    .btn-submit:hover { background: rgba(26,138,122,0.2); }
    .btn-drink { background: rgba(232,112,10,0.08); border-color: var(--accent); }
    .btn-drink:hover { background: rgba(232,112,10,0.18); }

    /* Submitted recipe cards */
    #submitted-cards { display: flex; gap: 10px; flex-wrap: wrap; min-height: 24px; }
    .submitted-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 10px;
      max-width: 200px;
      position: relative;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .submitted-card .sc-vessel { font-weight: bold; margin-bottom: 3px; }
    .submitted-card .sc-layers { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
    .submitted-card .sc-layer-dot {
      width: 12px; height: 12px; border-radius: 2px; display: inline-block;
    }
    .submitted-card .sc-delete {
      position: absolute; top: 2px; right: 5px;
      cursor: pointer; color: var(--dim); font-size: 10px;
    }
    .submitted-card .sc-delete:hover { color: var(--paprika); }

    /* Capacity bar */
    #capacity-bar {
      height: 4px;
      background: rgba(42,37,32,0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    #capacity-fill {
      height: 100%;
      background: var(--teal);
      transition: width 0.25s, background-color 0.25s;
      border-radius: 2px;
    }
    #capacity-fill.warn { background: var(--accent); }
    #capacity-fill.danger { background: var(--paprika); }

    /* ── Sauce Archive ───────────────────────────────────── */
    #sauce-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    #sauce-shelf {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      min-height: 48px;
    }
    .vial-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .vial {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    .vial-wrap:hover .vial { transform: scale(1.15); }
    .vial.selected {
      border-color: var(--ink);
      box-shadow: 0 0 8px rgba(42,37,32,0.3);
      transform: scale(1.15);
    }
    .vial.half {
      border: 2px dashed rgba(42,37,32,0.25);
    }
    .vial.barrel {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
    }
    .vial-name {
      font-size: 8px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: var(--dim);
      text-align: center;
    }
    .barrel-label {
      font-size: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dim);
    }
    #sauce-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    #combine-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px dashed var(--border);
    }
    #combine-label { font-size: 10px; color: var(--dim); }

    /* ── Ingredient Stock ────────────────────────────────── */
    #stock-section { padding-bottom: 8px; }
    #stock-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .stock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: grab;
      transition: opacity 0.15s, box-shadow 0.15s;
      min-width: 56px;
      box-shadow: 0 1px 2px var(--shadow);
    }
    .stock-item:hover { box-shadow: 0 2px 8px var(--glow); }
    .stock-item.in-trough { opacity: 0.3; cursor: default; }
    .stock-emoji { font-size: 20px; line-height: 1; }
    .stock-code { font-size: 9px; font-weight: bold; letter-spacing: 1px; }
    .stock-swatch { width: 100%; height: 3px; border-radius: 1px; margin-top: 1px; }

    /* ── Stock selected state ────────────────────────────── */
    .stock-item.selected {
      box-shadow: 0 0 0 2px var(--accent), 0 2px 8px var(--glow);
      background: rgba(232,112,10,0.08);
    }
    .trough:not(.filled).ready {
      box-shadow: 0 0 12px var(--glow), 0 0 0 2px var(--accent);
      cursor: pointer;
    }

    /* ── Start Day Button ─────────────────────────────────── */
    .btn-start-day {
      background: rgba(26,138,122,0.12);
      border: 2px solid var(--teal);
      color: var(--teal);
      padding: 10px 24px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 8px;
    }
    .btn-start-day:hover { background: rgba(26,138,122,0.25); }

    /* ── DAY Phase ───────────────────────────────────────── */
    #day-section { display: none; }

    #researcher-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .researcher-card {
      flex: 1;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .researcher-card.executing {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--glow);
    }
    .researcher-card.done {
      border-color: var(--teal);
    }
    .researcher-card.exploded {
      border-color: var(--paprika);
      box-shadow: 0 0 12px rgba(192,48,40,0.2);
    }
    .researcher-card.idle {
      opacity: 0.5;
    }
    .rc-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .rc-emoji { font-size: 22px; line-height: 1; }
    .rc-name { font-size: 12px; font-weight: bold; }
    .rc-title { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
    .rc-assignment {
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 6px;
      min-height: 16px;
    }
    .rc-layers {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      min-height: 20px;
    }
    .rc-layer {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      transition: transform 0.25s, opacity 0.25s;
      transform: scale(0);
      opacity: 0;
    }
    .rc-layer.revealed {
      transform: scale(1);
      opacity: 1;
    }
    .rc-layer.deviated {
      border: 2px dashed var(--accent);
    }
    .rc-layer.withheld {
      background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 5px) !important;
      opacity: 0.4;
    }
    .rc-status {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      min-height: 14px;
    }
    .rc-status.waiting { color: var(--dim); }
    .rc-status.executing { color: var(--accent); }
    .rc-status.complete { color: var(--teal); }
    .rc-status.exploded { color: var(--paprika); font-weight: bold; }

    /* ── Execution Log ───────────────────────────────────── */
    #execution-log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      max-height: 240px;
      overflow-y: auto;
    }
    .log-entry {
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
      animation: logFade 0.3s ease-out;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry.deviation { color: var(--accent); font-style: italic; }
    .log-entry.explosion { color: var(--paprika); font-weight: bold; font-size: 12px; }
    .log-entry.info { color: var(--dim); }
    @keyframes logFade {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── End of Day ──────────────────────────────────────── */
    #endofday-section { display: none; }
    .eod-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .eod-title {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .eod-results { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .eod-result {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .eod-result:last-child { border-bottom: none; }
    .eod-verdict { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .eod-verdict.pass { color: var(--teal); }
    .eod-verdict.fail { color: var(--paprika); }
    .eod-new-vials {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      min-height: 32px;
    }
    .eod-vial {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .eod-no-vials { font-size: 10px; color: var(--dim); font-style: italic; }

    /* ── Scrollbar ───────────────────────────────────────── */
    #bench::-webkit-scrollbar { width: 6px; }
    #bench::-webkit-scrollbar-track { background: transparent; }
    #bench::-webkit-scrollbar-thumb { background: rgba(232,112,10,0.2); border-radius: 3px; }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      #header h1 { font-size: 12px; letter-spacing: 1px; }
      .trough { width: 72px; height: 66px; }
      .trough-content { font-size: 20px; }
      .stock-item { min-width: 48px; padding: 4px 6px; }
      .stock-emoji { font-size: 16px; }
      .submitted-card { max-width: 160px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <h1>Taco Science Research Lab</h1>
    <span id="day-badge">Day 1</span>
  </div>

  <!-- Main bench -->
  <div id="bench">

    <!-- Troughs -->
    <div id="trough-section">
      <div class="section-label">Troughs</div>
      <div id="trough-row"></div>
    </div>

    <!-- Recipe Card Workspace -->
    <div id="recipe-workspace">
      <div class="section-label">Recipe Card</div>
      <div id="recipe-card">
        <div class="recipe-row">
          <label>Vessel</label>
          <select id="vessel-select"></select>
          <span id="vessel-stats"></span>
        </div>
        <div id="capacity-bar"><div id="capacity-fill"></div></div>
        <div class="recipe-row">
          <label>Layers</label>
          <div id="layer-slots"><span class="layer-placeholder">click trough ingredients to add layers</span></div>
        </div>
        <div class="recipe-row">
          <label>Sauce</label>
          <select id="sauce-select"><option value="">None</option></select>
        </div>
        <div class="recipe-row" style="justify-content:flex-end; gap:8px;">
          <button class="btn" id="clear-recipe-btn" onclick="clearRecipe()">Clear</button>
          <button class="btn btn-submit" id="submit-recipe-btn" onclick="submitRecipe()" disabled>Submit Card</button>
        </div>
      </div>
    </div>

    <!-- Submitted Cards -->
    <div id="submitted-section" style="display:none;">
      <div class="section-label">Submitted Cards</div>
      <div id="submitted-cards"></div>
    </div>

    <!-- Sauce Archive -->
    <div id="sauce-section">
      <div class="section-label">Sauce Archive</div>
      <div id="sauce-shelf"></div>
      <div id="sauce-controls">
        <button class="btn" id="combine-btn" onclick="combineSauces()" disabled>Combine</button>
        <button class="btn btn-drink" id="drink-half-btn" onclick="drinkVial('half')" disabled>Sip</button>
        <button class="btn btn-drink" id="drink-full-btn" onclick="drinkVial('full')" disabled>Drink</button>
        <div id="combine-preview"></div>
        <span id="combine-label">select 2 vials to combine, or 1 to drink</span>
      </div>
    </div>

    <!-- Ingredient Stock -->
    <div id="stock-section">
      <div class="section-label">Ingredient Stock</div>
      <div id="stock-row"></div>
    </div>

    <!-- DAY Phase -->
    <div id="day-section">
      <div class="section-label">Research in Progress</div>
      <div id="researcher-row"></div>
      <div id="execution-log">
        <div class="section-label">Lab Notes</div>
      </div>
    </div>

    <!-- End of Day -->
    <div id="endofday-section">
      <div class="eod-panel">
        <div class="eod-title">End of Day</div>
        <div class="eod-results" id="eod-results"></div>
        <div class="section-label" style="margin-bottom:6px;">New Vials</div>
        <div class="eod-new-vials" id="eod-new-vials"></div>
        <button class="btn btn-start-day" id="next-day-btn" onclick="nextDay()">Next Day</button>
      </div>
    </div>

  </div>



<script>
/* ================================================================
   TACO SCIENCE — Data & State
   ================================================================ */

const INGREDIENTS = [
  { code: 'MEA', name: 'Ground Beef',  color: [140, 60, 45],   cooperativeness: 0.3, layerPref: 'lower',   emoji: '\u{1F969}' },
  { code: 'TOM', name: 'Tomato',       color: [200, 60, 40],   cooperativeness: 0.7, layerPref: 'neutral', emoji: '\u{1F345}' },
  { code: 'CHE', name: 'Cheese',       color: [230, 190, 50],  cooperativeness: 0.6, layerPref: 'upper',   emoji: '\u{1F9C0}' },
  { code: 'LET', name: 'Lettuce',      color: [80, 170, 70],   cooperativeness: 0.8, layerPref: 'upper',   emoji: '\u{1F96C}' },
  { code: 'ION', name: 'Onion',        color: [210, 180, 160], cooperativeness: 0.5, layerPref: 'lower',   emoji: '\u{1F9C5}' },
  { code: 'BEN', name: 'Black Beans',  color: [45, 30, 25],    cooperativeness: 0.6, layerPref: 'lower',   emoji: '\u{1FAD8}' },
  { code: 'JAL', name: 'Jalape\u00F1o',color: [60, 140, 40],   cooperativeness: 0.2, layerPref: 'upper',   emoji: '\u{1F336}\u{FE0F}' },
  { code: 'CRM', name: 'Sour Cream',   color: [240, 235, 220], cooperativeness: 0.9, layerPref: 'upper',   emoji: '\u{1F95B}' },
  { code: 'RIC', name: 'Rice',         color: [230, 220, 190], cooperativeness: 0.8, layerPref: 'lower',   emoji: '\u{1F35A}' },
  { code: 'CIL', name: 'Cilantro',     color: [70, 160, 60],   cooperativeness: 0.7, layerPref: 'upper',   emoji: '\u{1F33F}' },

/* ── Sauce Name Generation ───────────────────────────── */

const SAUCE_PREFIXES = {
  warm:   ['Ember', 'Blaze', 'Char', 'Smolder', 'Flare', 'Scorch'],
  cool:   ['Moss', 'Brine', 'Frost', 'Tide', 'Mist', 'Dew'],
  bright: ['Flash', 'Spark', 'Gleam', 'Burst', 'Bloom', 'Flicker'],
  dark:   ['Murk', 'Shade', 'Soot', 'Char', 'Void', 'Depth'],
  neutral:['Stone', 'Dust', 'Haze', 'Drift', 'Grain', 'Smoke'],
};

const SAUCE_SUFFIXES_ORIGIN = {
  starter:  ['Original', 'Prime', 'Stock', 'Reserve'],
  combined: ['Blend', 'Fold', 'Splice', 'Weave', 'Cross'],
  halved:   ['Residue', 'Ghost', 'Echo', 'Trace', 'Wisp'],
  explosion:['Debris', 'Fallout', 'Shrapnel', 'Scatter', 'Remnant'],
};

function classifyColor(c) {
  const [r, g, b] = c;
  const lum = r * 0.299 + g * 0.587 + b * 0.114;
  if (lum < 80) return 'dark';
  if (lum > 190) return 'bright';
  if (r > g && r > b) return 'warm';
  if (b > r && b > g) return 'cool';
  if (g > r) return 'cool';
  return 'neutral';
}

function generateSauceName(color, origin) {
  const family = classifyColor(color);
  const prefixes = SAUCE_PREFIXES[family];
  const suffixes = SAUCE_SUFFIXES_ORIGIN[origin] || SAUCE_SUFFIXES_ORIGIN.combined;
  const p = prefixes[Math.floor(Math.random() * prefixes.length)];
  const s = suffixes[Math.floor(Math.random() * suffixes.length)];
  return `${p} ${s}`;
}

function generateSauceCode(name) {
  const words = name.split(' ');
  if (words.length >= 2) {
    return (words[0][0] + words[0][1] + words[1][0]).toUpperCase();
  }
  return name.slice(0, 3).toUpperCase();
}

/* ================================================================
   Color Utilities
   ================================================================ */

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function subtractMix(a, b) {
  return [
    Math.floor((a[0] + b[0]) / 2 * 0.85),
    Math.floor((a[1] + b[1]) / 2 * 0.85),
    Math.floor((a[2] + b[2]) / 2 * 0.85),
  ];
}

function halveColor(c) {
  return [
    Math.floor(c[0] * 0.7 + 200 * 0.3),
    Math.floor(c[1] * 0.7 + 200 * 0.3),
    Math.floor(c[2] * 0.7 + 200 * 0.3),
  ];
}

/* ── Tap ingredient to select, tap trough to place ──── */

function selectStock(code) {
  S.selectedStock = S.selectedStock === code ? null : code;
  renderStock();
}

function placeInTrough(slot) {
  if (S.selectedStock === null) return;
  const t = S.troughs[slot];
  if (t.ingredient) return;
  t.ingredient = S.selectedStock;
  S.selectedStock = null;
  renderTroughs();
  renderStock();
}

/* ── Trough -> Layer ─────────────────────────────────── */

function addLayerFromTrough(slot) {
  if (S.selectedStock !== null) return;
  const t = S.troughs[slot];
  if (!t.ingredient) return;
  const v = vesselById(S.currentRecipe.vessel);
  if (S.currentRecipe.layers.length >= v.capacity + 2) return;
  S.currentRecipe.layers.push(t.ingredient);
  renderLayers();
}

function removeLayer(index) {
  S.currentRecipe.layers.splice(index, 1);
  renderLayers();
}

/* ── Clear trough ────────────────────────────────────── */

function clearTrough(slot) {
  S.troughs[slot].ingredient = null;
  renderTroughs();
  renderStock();
}

/* ── Recipe submit / clear ───────────────────────────── */

function submitRecipe() {
  if (S.currentRecipe.layers.length === 0) return;
  if (S.recipes.length >= 3) return;
  S.recipes.push({
    id: S.recipes.length,
    vessel: S.currentRecipe.vessel,
    layers: [...S.currentRecipe.layers],
    sauce: S.currentRecipe.sauce,
    status: 'submitted',
  });
  clearRecipe();
  renderSubmittedCards();
  updateSubmitButton();
}

function clearRecipe() {
  S.currentRecipe.layers = [];
  S.currentRecipe.sauce = null;
  document.getElementById('sauce-select').value = '';
  renderLayers();
}

function deleteRecipe(index) {
  S.recipes.splice(index, 1);
  renderSubmittedCards();
  updateSubmitButton();
}

/* ── Sauce selection / combine / drink ───────────────── */

function toggleCombineSelection(id) {
  const idx = S.combineSelection.indexOf(id);
  if (idx >= 0) {
    S.combineSelection.splice(idx, 1);
  } else {
    if (S.combineSelection.length >= 2) S.combineSelection.shift();
    S.combineSelection.push(id);
  }
  renderSauceArchive();
}

function combineSauces() {
  if (S.combineSelection.length !== 2) return;
  const a = S.sauceArchive.find(s => s.id === S.combineSelection[0]);
  const b = S.sauceArchive.find(s => s.id === S.combineSelection[1]);
  if (!a || !b) return;
  const mixed = subtractMix(a.color, b.color);
  const name = generateSauceName(mixed, 'combined');
  S.sauceArchive.push({
    id: nextSauceId++,
    color: mixed,
    fill: 1,
    barrel: false,
    origin: 'combined',
    name,
    code: generateSauceCode(name),
    day: S.day,
  });
  S.combineSelection = [];
  renderSauceArchive();
}

function drinkVial(amount) {
  if (S.combineSelection.length !== 1) return;
  const s = S.sauceArchive.find(s => s.id === S.combineSelection[0]);
  if (!s) return;

  if (s.barrel) {
    // Barrels pour a copy — never deplete
    const pourColor = amount === 'full' ? [...s.color] : halveColor(s.color);
    const pourOrigin = amount === 'full' ? 'combined' : 'halved';
    const pourName = generateSauceName(pourColor, pourOrigin);
    S.sauceArchive.push({
      id: nextSauceId++,
      color: pourColor,
      fill: amount === 'full' ? 1 : 0.5,
      barrel: false,
      origin: pourOrigin,
      name: pourName,
      code: generateSauceCode(pourName),
      day: S.day,
    });
  } else {
    // Finite vials deplete
    if (amount === 'full') {
      s.fill = 0;
    } else {
      if (s.fill <= 0.5) {
        s.fill = 0;
      } else {
        s.fill = 0.5;
        s.color = halveColor(s.color);
        s.name = generateSauceName(s.color, 'halved');
        s.code = generateSauceCode(s.name);
      }
    }
  }

  S.combineSelection = [];
  renderSauceArchive();
}

/* ================================================================
   DAY Phase — Execution Engine
   ================================================================ */

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function ingredientLuminance(code) {
  const ing = ingredientByCode(code);
  if (!ing) return 128;
  const [r, g, b] = ing.color;
  return r * 0.299 + g * 0.587 + b * 0.114;
}

function ingredientColorFamily(code) {
  const ing = ingredientByCode(code);
  if (!ing) return 'neutral';
  return classifyColor(ing.color);
}

/* Which trough materials hold which ingredients right now */
function troughMaterialFor(code) {
  const t = S.troughs.find(t => t.ingredient === code);
  return t ? t.material : null;
}

/* Execute a single recipe through a researcher's personality */
function executeRecipe(researcher, recipe) {
  const vessel = vesselById(recipe.vessel);
  const actualLayers = [];
  const deviations = [];
  const availableTrough = S.troughs.filter(t => t.ingredient).map(t => t.ingredient);

  for (let i = 0; i < recipe.layers.length; i++) {
    const code = recipe.layers[i];
    const roll = Math.random();

    if (researcher.deviationStyle === 'withhold') {
      // Lumen withholds ingredients she thinks are muddy (low luminance)
      if (roll < researcher.deviationChance && ingredientLuminance(code) < 140) {
        deviations.push({ type: 'withheld', index: i, code, msg: `${researcher.emoji} ${researcher.name} withholds ${code} \u2014 too muddy` });
        continue;
      }
      actualLayers.push(code);

    } else if (researcher.deviationStyle === 'embellish') {
      actualLayers.push(code);
      if (roll < researcher.deviationChance) {
        // Nudo embellishes: add a favorite, swap order, or grab from troughs
        const action = Math.random();
        if (action < 0.4 && researcher.favorites.length > 0) {
          // Sneak in a favorite
          const fav = researcher.favorites[Math.floor(Math.random() * researcher.favorites.length)];
          actualLayers.push(fav);
          deviations.push({ type: 'added', index: i, code: fav, msg: `${researcher.emoji} ${researcher.name} sneaks in ${fav} \u2014 couldn't resist` });
        } else if (action < 0.7 && actualLayers.length >= 2) {
          // Swap last two layers
          const last = actualLayers.length - 1;
          [actualLayers[last], actualLayers[last - 1]] = [actualLayers[last - 1], actualLayers[last]];
          deviations.push({ type: 'swapped', index: i, code, msg: `${researcher.emoji} ${researcher.name} swaps the last two layers \u2014 "better flow"` });
        } else if (availableTrough.length > 0) {
          // Grab something from troughs not in recipe
          const offMenu = availableTrough.filter(c => !recipe.layers.includes(c));
          if (offMenu.length > 0) {
            const pick = offMenu[Math.floor(Math.random() * offMenu.length)];
            actualLayers.push(pick);
            deviations.push({ type: 'added', index: i, code: pick, msg: `${researcher.emoji} ${researcher.name} adds ${pick} \u2014 not on the card!` });
          }
        }
      }

    } else if (researcher.deviationStyle === 'favor') {
      actualLayers.push(code);
      // Fenn doubles up on favorites
      if (roll < researcher.deviationChance && researcher.favorites.includes(code)) {
        actualLayers.push(code);
        deviations.push({ type: 'doubled', index: i, code, msg: `${researcher.emoji} ${researcher.name} doubles up on ${code} \u2014 old friend` });
      }
    }
  }

  // Explosion check
  const exploded = actualLayers.length > vessel.capacity;
  let residueVial = null;

  if (exploded) {
    // Mix all layer colors
    let mixed = [...ingredientByCode(actualLayers[0]).color];
    for (let i = 1; i < actualLayers.length; i++) {
      mixed = subtractMix(mixed, ingredientByCode(actualLayers[i]).color);
    }
    const name = generateSauceName(mixed, 'explosion');
    residueVial = {
      id: nextSauceId++,
      color: mixed,
      fill: 1,
      barrel: false,
      origin: 'explosion',
      name,
      code: generateSauceCode(name),
      day: S.day,
    };
  }

  return { researcher, recipe, actualLayers, deviations, exploded, residueVial, vessel };
}

/* Assign recipes to researchers round-robin */
function assignRecipes() {
  return S.recipes.map((recipe, i) => ({
    researcher: S.researchers[i % S.researchers.length],
    recipe,
  }));
}

/* ── DAY Phase Rendering ────────────────────────────── */

function addLog(msg, cls) {
  const log = document.getElementById('execution-log');
  const el = document.createElement('div');
  el.className = 'log-entry' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  log.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderResearcherCards(assignments) {
  const row = document.getElementById('researcher-row');
  row.innerHTML = '';
  S.researchers.forEach(r => {
    const assignment = assignments.find(a => a.researcher.id === r.id);
    const el = document.createElement('div');
    el.className = 'researcher-card' + (assignment ? '' : ' idle');
    el.id = 'rc-' + r.id;
    el.innerHTML = `
      <div class="rc-header">
        <span class="rc-emoji">${r.emoji}</span>
        <div>
          <div class="rc-name">${r.name}</div>
          <div class="rc-title">${r.title}</div>
        </div>
      </div>
      <div class="rc-assignment" id="rc-assign-${r.id}">${assignment ? vesselById(assignment.recipe.vessel).emoji + ' ' + vesselById(assignment.recipe.vessel).name : 'No card'}</div>
      <div class="rc-layers" id="rc-layers-${r.id}"></div>
      <div class="rc-status waiting" id="rc-status-${r.id}">${assignment ? 'waiting' : '\u2014'}</div>
    `;
    row.appendChild(el);
  });
}

function revealLayer(researcherId, color, deviated, withheld) {
  const container = document.getElementById('rc-layers-' + researcherId);
  const el = document.createElement('div');
  el.className = 'rc-layer' + (deviated ? ' deviated' : '') + (withheld ? ' withheld' : '');
  el.style.background = rgb(color);
  el.title = deviated ? 'deviation' : (withheld ? 'withheld' : '');
  container.appendChild(el);
  // Trigger animation
  requestAnimationFrame(() => el.classList.add('revealed'));
}

function setResearcherStatus(researcherId, status) {
  const card = document.getElementById('rc-' + researcherId);
  const statusEl = document.getElementById('rc-status-' + researcherId);
  card.className = 'researcher-card ' + status;
  statusEl.className = 'rc-status ' + status;
  const labels = { waiting: 'waiting', executing: 'executing...', complete: 'done', exploded: 'EXPLODED' };
  statusEl.textContent = labels[status] || status;
}

/* ── Phase Transitions ──────────────────────────────── */

function showPrepUI(show) {
  ['trough-section', 'recipe-workspace', 'submitted-section', 'sauce-section', 'stock-section'].forEach(id => {
    document.getElementById(id).style.display = show ? '' : 'none';
  });
}

function startDay() {
  if (S.recipes.length === 0) return;
  S.phase = 'day';
  S.dayLog = [];
  S.dayResults = [];

  showPrepUI(false);
  document.getElementById('day-section').style.display = 'block';
  document.getElementById('endofday-section').style.display = 'none';

  // Clear log
  const log = document.getElementById('execution-log');
  log.innerHTML = '<div class="section-label">Lab Notes</div>';

  const assignments = assignRecipes();
  renderResearcherCards(assignments);
  runDay(assignments);
}

async function runDay(assignments) {
  const perStep = 550;
  const perCard = 900;

  for (let i = 0; i < assignments.length; i++) {
    const { researcher, recipe } = assignments[i];
    const vessel = vesselById(recipe.vessel);

    await delay(perCard);
    setResearcherStatus(researcher.id, 'executing');
    addLog(`${researcher.emoji} ${researcher.name} picks up the card: ${vessel.emoji} ${vessel.name}`, 'info');

    const result = executeRecipe(researcher, recipe);
    S.dayResults.push(result);

    // Walk through the original recipe layers + deviations for narrative
    let revealIdx = 0;
    const deviationMap = {};
    result.deviations.forEach(d => {
      if (!deviationMap[d.index]) deviationMap[d.index] = [];
      deviationMap[d.index].push(d);
    });

    // Reveal actual layers one by one
    for (let j = 0; j < result.actualLayers.length; j++) {
      await delay(perStep);
      const code = result.actualLayers[j];
      const ing = ingredientByCode(code);

      // Check if this layer corresponds to a deviation
      const isDeviation = result.deviations.some(d =>
        (d.type === 'added' || d.type === 'doubled' || d.type === 'swapped') && d.code === code && !d._shown
      );

      if (isDeviation) {
        const dev = result.deviations.find(d => (d.type === 'added' || d.type === 'doubled' || d.type === 'swapped') && d.code === code && !d._shown);
        if (dev) {
          dev._shown = true;
          addLog(dev.msg, 'deviation');
        }
        revealLayer(researcher.id, ing.color, true, false);
      } else {
        addLog(`${researcher.emoji} adds ${ing.emoji} ${code}`, '');
        revealLayer(researcher.id, ing.color, false, false);
      }
    }

    // Show withheld deviations
    const withholds = result.deviations.filter(d => d.type === 'withheld');
    for (const w of withholds) {
      await delay(300);
      const ing = ingredientByCode(w.code);
      addLog(w.msg, 'deviation');
      revealLayer(researcher.id, ing.color, false, true);
    }

    // Explosion?
    if (result.exploded) {
      await delay(500);
      addLog(`\u{1F4A5} EXPLOSION! ${researcher.name}'s ${vessel.name} exceeds capacity (${result.actualLayers.length}/${vessel.capacity})!`, 'explosion');
      setResearcherStatus(researcher.id, 'exploded');

      // Add residue vial
      S.sauceArchive.push(result.residueVial);
      await delay(300);
      addLog(`Residue collected: ${result.residueVial.name}`, 'info');

      // Explosion response
      if (researcher.explosionResponse === 'rattled') {
        researcher.deviationChance = Math.max(0.05, researcher.deviationChance - 0.08);
        addLog(`${researcher.emoji} ${researcher.name} adjusts her notes nervously...`, 'info');
      } else if (researcher.explosionResponse === 'inspired') {
        researcher.deviationChance = Math.min(0.8, researcher.deviationChance + 0.08);
        addLog(`${researcher.emoji} ${researcher.name} grins. "Beautiful."`, 'info');
      } else if (researcher.explosionResponse === 'curious') {
        addLog(`${researcher.emoji} ${researcher.name} examines the residue carefully, takes notes.`, 'info');
      }
    } else {
      setResearcherStatus(researcher.id, 'complete');
      addLog(`${researcher.emoji} ${researcher.name} finishes the ${vessel.name}. \u2713`, 'info');
    }
  }

  // Unassigned researchers get a note
  const assignedIds = new Set(assignments.map(a => a.researcher.id));
  S.researchers.filter(r => !assignedIds.has(r.id)).forEach(r => {
    addLog(`${r.emoji} ${r.name} reorganizes the shelf.`, 'info');
  });

  await delay(1200);
  S.phase = 'endOfDay';
  renderEndOfDay();
}

/* ── End of Day ─────────────────────────────────────── */

function renderEndOfDay() {
  document.getElementById('day-section').style.display = 'none';
  document.getElementById('endofday-section').style.display = 'block';

  const resultsEl = document.getElementById('eod-results');
  resultsEl.innerHTML = '';
  S.dayResults.forEach(r => {
    const vessel = vesselById(r.recipe.vessel);
    const el = document.createElement('div');
    el.className = 'eod-result';
    el.innerHTML = `
      <span>${r.researcher.emoji}</span>
      <span>${r.researcher.name}</span>
      <span>${vessel.emoji} ${vessel.name}</span>
      <span>${r.actualLayers.length} layers</span>
      <span class="eod-verdict ${r.exploded ? 'fail' : 'pass'}">${r.exploded ? '\u{1F4A5} exploded' : '\u2713 complete'}</span>
    `;
    resultsEl.appendChild(el);
  });

  const vialsEl = document.getElementById('eod-new-vials');
  vialsEl.innerHTML = '';
  const newVials = S.dayResults.filter(r => r.residueVial).map(r => r.residueVial);
  if (newVials.length === 0) {
    vialsEl.innerHTML = '<span class="eod-no-vials">No explosions today \u2014 a clean day in the lab.</span>';
  } else {
    newVials.forEach(v => {
      const el = document.createElement('div');
      el.className = 'eod-vial';
      el.style.background = rgb(v.color);
      el.title = v.name;
      vialsEl.appendChild(el);
      const label = document.createElement('span');
      label.style.fontSize = '10px';
      label.style.color = 'var(--dim)';
      label.textContent = v.code;
      vialsEl.appendChild(label);
    });
  }
}

function nextDay() {
  S.day++;
  S.phase = 'prep';
  S.recipes = [];
  S.dayLog = [];
  S.dayResults = [];
  S.currentRecipe = { vessel: 'taco', layers: [], sauce: null };
  S.combineSelection = [];

  document.getElementById('endofday-section').style.display = 'none';
  showPrepUI(true);

  document.getElementById('day-badge').textContent = 'Day ' + S.day;
  renderTroughs();
  renderStock();
  renderVesselSelect();
  renderLayers();
  renderSauceArchive();
  renderSubmittedCards();
}

/* ================================================================
   Init
   ================================================================ */

function init() {
  initStarterSauces();
  renderTroughs();
  renderStock();
  renderVesselSelect();
  renderLayers();
  renderSauceArchive();
  renderSubmittedCards();

  hubMsg('hub:minimize');
  hubMsg('hub:color', { r: 240, g: 138, b: 40 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
