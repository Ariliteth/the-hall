<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taco Science</title>
  <style>
    :root {
      --lab-white:  #f4f2ed;
      --lab-warm:   #faf8f3;
      --surface:    #ffffff;
      --grid:       rgba(180,175,160,0.18);
      --ink:        #2a2520;
      --dim:        rgba(42,37,32,0.45);
      --accent:     #e8700a;
      --teal:       #1a8a7a;
      --paprika:    #c03028;
      --sage:       #4a9a52;
      --border:     rgba(42,37,32,0.12);
      --shadow:     rgba(42,37,32,0.06);
      --glow:       rgba(232,112,10,0.15);
      --metal-bg:   #d8d8dc;
      --metal-bdr:  #a0a0a8;
      --plastic-bg: #fff8ee;
      --plastic-bdr:#e89030;
      --bedazzle-bg:#f4eef8;
      --bedazzle-bdr:#b878d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--lab-white);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
    }

    /* ── Header ──────────────────────────────────────────── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      flex-shrink: 0;
      box-shadow: 0 1px 4px var(--shadow);
    }
    #header h1 {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    #day-badge {
      font-size: 12px;
      color: var(--dim);
      background: var(--lab-warm);
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    /* ── Main bench area ─────────────────────────────────── */
    #bench {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--dim);
      margin-bottom: 4px;
    }

    /* ── Troughs ─────────────────────────────────────────── */
    #trough-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .trough {
      width: 90px;
      height: 80px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: default;
      transition: box-shadow 0.2s;
      position: relative;
    }
    .trough.metal {
      background: var(--metal-bg);
      border: 2px solid var(--metal-bdr);
    }
    .trough.plastic {
      background: var(--plastic-bg);
      border: 2px dashed var(--plastic-bdr);
    }
    .trough.bedazzled {
      background: var(--bedazzle-bg);
      border: 2px solid var(--bedazzle-bdr);
      box-shadow: inset 0 0 12px rgba(184,120,208,0.12);
    }
    .trough.hover {
      box-shadow: 0 0 12px var(--glow), 0 0 0 2px var(--accent);
    }
    .trough-material {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      position: absolute;
      bottom: 4px;
    }
    .trough-content { font-size: 24px; line-height: 1; }
    .trough-code { font-size: 10px; font-weight: bold; color: var(--ink); }
    .trough-empty { font-size: 20px; color: rgba(42,37,32,0.15); }
    .trough-clear {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 10px;
      color: var(--dim);
      cursor: pointer;
      display: none;
    }
    .trough.filled .trough-clear { display: block; }

    /* ── Recipe Card Workspace ────────────────────────────── */
    #recipe-workspace {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    #recipe-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .recipe-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .recipe-row label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      width: 60px;
      flex-shrink: 0;
    }
    .recipe-row select {
      background: var(--lab-warm);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    /* Layers display */
    #layer-slots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 36px;
      align-items: center;
    }
    .layer-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .layer-chip:hover { opacity: 0.7; }
    .layer-chip .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .layer-num { font-size: 9px; color: var(--dim); margin-right: 2px; }
    .layer-placeholder {
      font-size: 11px;
      color: rgba(42,37,32,0.25);
      font-style: italic;
    }

    /* Vessel stats */
    #vessel-stats {
      font-size: 10px;
      color: var(--dim);
      display: flex;
      gap: 12px;
    }
    #vessel-stats span { white-space: nowrap; }
    .stat-val { color: var(--accent); font-weight: bold; }

    /* Buttons */
    .btn {
      background: var(--lab-warm);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--glow); border-color: var(--accent); }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .btn:disabled:hover { background: var(--lab-warm); border-color: var(--border); }
    .btn-submit { background: rgba(26,138,122,0.1); border-color: var(--teal); color: var(--teal); }
    .btn-submit:hover { background: rgba(26,138,122,0.2); }
    .btn-drink { background: rgba(232,112,10,0.08); border-color: var(--accent); }
    .btn-drink:hover { background: rgba(232,112,10,0.18); }

    /* Submitted recipe cards */
    #submitted-cards { display: flex; gap: 10px; flex-wrap: wrap; min-height: 24px; }
    .submitted-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 10px;
      max-width: 200px;
      position: relative;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .submitted-card .sc-vessel { font-weight: bold; margin-bottom: 3px; }
    .submitted-card .sc-layers { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
    .submitted-card .sc-layer-dot {
      width: 12px; height: 12px; border-radius: 2px; display: inline-block;
    }
    .submitted-card .sc-delete {
      position: absolute; top: 2px; right: 5px;
      cursor: pointer; color: var(--dim); font-size: 10px;
    }
    .submitted-card .sc-delete:hover { color: var(--paprika); }

    /* Capacity bar */
    #capacity-bar {
      height: 4px;
      background: rgba(42,37,32,0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    #capacity-fill {
      height: 100%;
      background: var(--teal);
      transition: width 0.25s, background-color 0.25s;
      border-radius: 2px;
    }
    #capacity-fill.warn { background: var(--accent); }
    #capacity-fill.danger { background: var(--paprika); }

    /* ── Sauce Archive ───────────────────────────────────── */
    #sauce-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    #sauce-shelf {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      min-height: 48px;
    }
    .vial-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .vial {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    .vial-wrap:hover .vial { transform: scale(1.15); }
    .vial.selected {
      border-color: var(--ink);
      box-shadow: 0 0 8px rgba(42,37,32,0.3);
      transform: scale(1.15);
    }
    .vial.half {
      border: 2px dashed rgba(42,37,32,0.25);
    }
    .vial.barrel {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
    }
    .vial-name {
      font-size: 8px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: var(--dim);
      text-align: center;
    }
    .barrel-label {
      font-size: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dim);
    }
    #sauce-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    #combine-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px dashed var(--border);
    }
    #combine-label { font-size: 10px; color: var(--dim); }

    /* ── Ingredient Stock ────────────────────────────────── */
    #stock-section { padding-bottom: 8px; }
    #stock-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .stock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: grab;
      transition: opacity 0.15s, box-shadow 0.15s;
      min-width: 56px;
      box-shadow: 0 1px 2px var(--shadow);
    }
    .stock-item:hover { box-shadow: 0 2px 8px var(--glow); }
    .stock-item.in-trough { opacity: 0.3; cursor: default; }
    .stock-emoji { font-size: 20px; line-height: 1; }
    .stock-code { font-size: 9px; font-weight: bold; letter-spacing: 1px; }
    .stock-swatch { width: 100%; height: 3px; border-radius: 1px; margin-top: 1px; }

    /* ── Drag Ghost ──────────────────────────────────────── */
    #drag-ghost {
      position: fixed;
      display: none;
      font-size: 36px;
      pointer-events: none;
      z-index: 100;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
      transform: translate(-50%, -50%);
    }
    #drag-ghost.active { display: block; }

    /* ── Scrollbar ───────────────────────────────────────── */
    #bench::-webkit-scrollbar { width: 6px; }
    #bench::-webkit-scrollbar-track { background: transparent; }
    #bench::-webkit-scrollbar-thumb { background: rgba(232,112,10,0.2); border-radius: 3px; }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      #header h1 { font-size: 12px; letter-spacing: 1px; }
      .trough { width: 72px; height: 66px; }
      .trough-content { font-size: 20px; }
      .stock-item { min-width: 48px; padding: 4px 6px; }
      .stock-emoji { font-size: 16px; }
      .submitted-card { max-width: 160px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <h1>Taco Science Research Lab</h1>
    <span id="day-badge">Day 1</span>
  </div>

  <!-- Main bench -->
  <div id="bench">

    <!-- Troughs -->
    <div id="trough-section">
      <div class="section-label">Troughs</div>
      <div id="trough-row"></div>
    </div>

    <!-- Recipe Card Workspace -->
    <div id="recipe-workspace">
      <div class="section-label">Recipe Card</div>
      <div id="recipe-card">
        <div class="recipe-row">
          <label>Vessel</label>
          <select id="vessel-select"></select>
          <span id="vessel-stats"></span>
        </div>
        <div id="capacity-bar"><div id="capacity-fill"></div></div>
        <div class="recipe-row">
          <label>Layers</label>
          <div id="layer-slots"><span class="layer-placeholder">click trough ingredients to add layers</span></div>
        </div>
        <div class="recipe-row">
          <label>Sauce</label>
          <select id="sauce-select"><option value="">None</option></select>
        </div>
        <div class="recipe-row" style="justify-content:flex-end; gap:8px;">
          <button class="btn" id="clear-recipe-btn" onclick="clearRecipe()">Clear</button>
          <button class="btn btn-submit" id="submit-recipe-btn" onclick="submitRecipe()" disabled>Submit Card</button>
        </div>
      </div>
    </div>

    <!-- Submitted Cards -->
    <div id="submitted-section" style="display:none;">
      <div class="section-label">Submitted Cards</div>
      <div id="submitted-cards"></div>
    </div>

    <!-- Sauce Archive -->
    <div id="sauce-section">
      <div class="section-label">Sauce Archive</div>
      <div id="sauce-shelf"></div>
      <div id="sauce-controls">
        <button class="btn" id="combine-btn" onclick="combineSauces()" disabled>Combine</button>
        <button class="btn btn-drink" id="drink-half-btn" onclick="drinkVial('half')" disabled>Sip</button>
        <button class="btn btn-drink" id="drink-full-btn" onclick="drinkVial('full')" disabled>Drink</button>
        <div id="combine-preview"></div>
        <span id="combine-label">select 2 vials to combine, or 1 to drink</span>
      </div>
    </div>

    <!-- Ingredient Stock -->
    <div id="stock-section">
      <div class="section-label">Ingredient Stock</div>
      <div id="stock-row"></div>
    </div>

  </div>

  <!-- Drag ghost -->
  <div id="drag-ghost"></div>

<script>
/* ================================================================
   TACO SCIENCE — Data & State
   ================================================================ */

const INGREDIENTS = [
  { code: 'MEA', name: 'Ground Beef',  color: [140, 60, 45],   cooperativeness: 0.3, layerPref: 'lower',   emoji: '\u{1F969}' },
  { code: 'TOM', name: 'Tomato',       color: [200, 60, 40],   cooperativeness: 0.7, layerPref: 'neutral', emoji: '\u{1F345}' },
  { code: 'CHE', name: 'Cheese',       color: [230, 190, 50],  cooperativeness: 0.6, layerPref: 'upper',   emoji: '\u{1F9C0}' },
  { code: 'LET', name: 'Lettuce',      color: [80, 170, 70],   cooperativeness: 0.8, layerPref: 'upper',   emoji: '\u{1F96C}' },
  { code: 'ION', name: 'Onion',        color: [210, 180, 160], cooperativeness: 0.5, layerPref: 'lower',   emoji: '\u{1F9C5}' },
  { code: 'BEN', name: 'Black Beans',  color: [45, 30, 25],    cooperativeness: 0.6, layerPref: 'lower',   emoji: '\u{1FAD8}' },
  { code: 'JAL', name: 'Jalape\u00F1o',color: [60, 140, 40],   cooperativeness: 0.2, layerPref: 'upper',   emoji: '\u{1F336}\u{FE0F}' },
  { code: 'CRM', name: 'Sour Cream',   color: [240, 235, 220], cooperativeness: 0.9, layerPref: 'upper',   emoji: '\u{1F95B}' },
  { code: 'RIC', name: 'Rice',         color: [230, 220, 190], cooperativeness: 0.8, layerPref: 'lower',   emoji: '\u{1F35A}' },
  { code: 'CIL', name: 'Cilantro',     color: [70, 160, 60],   cooperativeness: 0.7, layerPref: 'upper',   emoji: '\u{1F33F}' },
];

const VESSELS = [
  { id: 'taco',    name: 'Taco',    capacity: 5, concentration: 0.8, diffusion: 0.5, emoji: '\u{1F32E}', shape: 'triangle' },
  { id: 'nacho',   name: 'Nacho',   capacity: 3, concentration: 1.0, diffusion: 0.2, emoji: '\u{1F4A5}', shape: 'small-tri' },
  { id: 'burrito', name: 'Burrito', capacity: 7, concentration: 0.5, diffusion: 0.1, emoji: '\u{1F32F}', shape: 'rect' },
  { id: 'bowl',    name: 'Bowl',    capacity: 7, concentration: 0.3, diffusion: 0.9, emoji: '\u{1F963}', shape: 'circle' },
];

const TROUGH_MATERIALS = ['metal', 'metal', 'plastic', 'bedazzled'];

/* ── Sauce Name Generation ───────────────────────────── */

const SAUCE_PREFIXES = {
  warm:   ['Ember', 'Blaze', 'Char', 'Smolder', 'Flare', 'Scorch'],
  cool:   ['Moss', 'Brine', 'Frost', 'Tide', 'Mist', 'Dew'],
  bright: ['Flash', 'Spark', 'Gleam', 'Burst', 'Bloom', 'Flicker'],
  dark:   ['Murk', 'Shade', 'Soot', 'Char', 'Void', 'Depth'],
  neutral:['Stone', 'Dust', 'Haze', 'Drift', 'Grain', 'Smoke'],
};

const SAUCE_SUFFIXES_ORIGIN = {
  starter:  ['Original', 'Prime', 'Stock', 'Reserve'],
  combined: ['Blend', 'Fold', 'Splice', 'Weave', 'Cross'],
  halved:   ['Residue', 'Ghost', 'Echo', 'Trace', 'Wisp'],
  explosion:[],
};

function classifyColor(c) {
  const [r, g, b] = c;
  const lum = r * 0.299 + g * 0.587 + b * 0.114;
  if (lum < 80) return 'dark';
  if (lum > 190) return 'bright';
  if (r > g && r > b) return 'warm';
  if (b > r && b > g) return 'cool';
  if (g > r) return 'cool';
  return 'neutral';
}

function generateSauceName(color, origin) {
  const family = classifyColor(color);
  const prefixes = SAUCE_PREFIXES[family];
  const suffixes = SAUCE_SUFFIXES_ORIGIN[origin] || SAUCE_SUFFIXES_ORIGIN.combined;
  const p = prefixes[Math.floor(Math.random() * prefixes.length)];
  const s = suffixes[Math.floor(Math.random() * suffixes.length)];
  return `${p} ${s}`;
}

function generateSauceCode(name) {
  const words = name.split(' ');
  if (words.length >= 2) {
    return (words[0][0] + words[0][1] + words[1][0]).toUpperCase();
  }
  return name.slice(0, 3).toUpperCase();
}

/* ── Lookups ─────────────────────────────────────────── */

function ingredientByCode(code) {
  return INGREDIENTS.find(i => i.code === code);
}

function vesselById(id) {
  return VESSELS.find(v => v.id === id);
}

/* ── State ────────────────────────────────────────────── */
let nextSauceId = 1;

const S = {
  day: 1,
  phase: 'prep',
  troughs: TROUGH_MATERIALS.map((mat, i) => ({ slot: i, material: mat, ingredient: null })),
  stock: INGREDIENTS.map(i => i.code),
  recipes: [],
  currentRecipe: { vessel: 'taco', layers: [], sauce: null },
  sauceArchive: [],
  combineSelection: [],
  drag: { active: false, code: null, x: 0, y: 0 },
};

function initStarterSauces() {
  S.sauceArchive = [
    { id: nextSauceId++, color: [180, 40, 30],  fill: 1, barrel: true, origin: 'starter', name: 'Ember Barrel',  code: 'EMB', day: 0 },
    { id: nextSauceId++, color: [50, 140, 60],   fill: 1, barrel: true, origin: 'starter', name: 'Moss Barrel',   code: 'MOS', day: 0 },
    { id: nextSauceId++, color: [200, 160, 40],  fill: 1, barrel: true, origin: 'starter', name: 'Flash Barrel',  code: 'FLB', day: 0 },
  ];
}

/* ================================================================
   Color Utilities
   ================================================================ */

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function subtractMix(a, b) {
  return [
    Math.floor((a[0] + b[0]) / 2 * 0.85),
    Math.floor((a[1] + b[1]) / 2 * 0.85),
    Math.floor((a[2] + b[2]) / 2 * 0.85),
  ];
}

function halveColor(c) {
  return [
    Math.floor(c[0] * 0.7 + 200 * 0.3),
    Math.floor(c[1] * 0.7 + 200 * 0.3),
    Math.floor(c[2] * 0.7 + 200 * 0.3),
  ];
}

/* ================================================================
   Hub Integration
   ================================================================ */

function hubMsg(type, extra) {
  try { window.parent.postMessage({ type, ...extra }, '*'); } catch(e) {}
}

/* ================================================================
   Rendering
   ================================================================ */

function renderTroughs() {
  const row = document.getElementById('trough-row');
  row.innerHTML = '';
  S.troughs.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = `trough ${t.material}${t.ingredient ? ' filled' : ''}`;
    el.dataset.slot = i;

    if (t.ingredient) {
      const ing = ingredientByCode(t.ingredient);
      el.innerHTML = `
        <span class="trough-content">${ing.emoji}</span>
        <span class="trough-code">${ing.code}</span>
        <span class="trough-material">${t.material}</span>
        <span class="trough-clear" onclick="event.stopPropagation(); clearTrough(${i})">\u2715</span>
      `;
      el.onclick = () => addLayerFromTrough(i);
      el.style.cursor = 'pointer';
    } else {
      el.innerHTML = `
        <span class="trough-empty">+</span>
        <span class="trough-material">${t.material}</span>
      `;
    }
    row.appendChild(el);
  });
}

function renderStock() {
  const row = document.getElementById('stock-row');
  row.innerHTML = '';
  const inTrough = new Set(S.troughs.filter(t => t.ingredient).map(t => t.ingredient));

  S.stock.forEach(code => {
    const ing = ingredientByCode(code);
    const el = document.createElement('div');
    el.className = `stock-item${inTrough.has(code) ? ' in-trough' : ''}`;
    el.dataset.code = code;
    el.innerHTML = `
      <span class="stock-emoji">${ing.emoji}</span>
      <span class="stock-code">${code}</span>
      <div class="stock-swatch" style="background:${rgb(ing.color)}"></div>
    `;
    if (!inTrough.has(code)) {
      el.onpointerdown = (e) => startDrag(e, code);
    }
    row.appendChild(el);
  });
}

function renderVesselSelect() {
  const sel = document.getElementById('vessel-select');
  sel.innerHTML = '';
  VESSELS.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = `${v.emoji} ${v.name}`;
    sel.appendChild(opt);
  });
  sel.value = S.currentRecipe.vessel;
  sel.onchange = () => {
    S.currentRecipe.vessel = sel.value;
    renderVesselStats();
    renderCapacityBar();
  };
  renderVesselStats();
}

function renderVesselStats() {
  const v = vesselById(S.currentRecipe.vessel);
  document.getElementById('vessel-stats').innerHTML = `
    <span>cap: <span class="stat-val">${v.capacity}</span></span>
    <span>conc: <span class="stat-val">${(v.concentration * 100).toFixed(0)}%</span></span>
    <span>diff: <span class="stat-val">${(v.diffusion * 100).toFixed(0)}%</span></span>
  `;
}

function renderLayers() {
  const el = document.getElementById('layer-slots');
  if (S.currentRecipe.layers.length === 0) {
    el.innerHTML = '<span class="layer-placeholder">click trough ingredients to add layers</span>';
  } else {
    el.innerHTML = '';
    S.currentRecipe.layers.forEach((code, i) => {
      const ing = ingredientByCode(code);
      const chip = document.createElement('div');
      chip.className = 'layer-chip';
      chip.style.background = rgba(ing.color, 0.18);
      chip.style.border = `1px solid ${rgba(ing.color, 0.4)}`;
      chip.innerHTML = `
        <span class="layer-num">${i + 1}</span>
        <span class="swatch" style="background:${rgb(ing.color)}"></span>
        ${code}
      `;
      chip.title = `${ing.name} \u2014 click to remove`;
      chip.onclick = () => removeLayer(i);
      el.appendChild(chip);
    });
  }
  renderCapacityBar();
  updateSubmitButton();
}

function renderCapacityBar() {
  const v = vesselById(S.currentRecipe.vessel);
  const fill = document.getElementById('capacity-fill');
  const pct = Math.min(100, (S.currentRecipe.layers.length / v.capacity) * 100);
  fill.style.width = pct + '%';
  fill.className = '';
  if (pct >= 100) fill.classList.add('danger');
  else if (pct >= 70) fill.classList.add('warn');
}

function renderSauceSelect() {
  const sel = document.getElementById('sauce-select');
  sel.innerHTML = '<option value="">None</option>';
  S.sauceArchive.forEach(s => {
    if (s.fill <= 0 && !s.barrel) return;
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.code} — ${s.name}${!s.barrel && s.fill < 1 ? ' (half)' : ''}`;
    opt.style.color = rgb(s.color);
    sel.appendChild(opt);
  });
  sel.value = S.currentRecipe.sauce || '';
  sel.onchange = () => {
    S.currentRecipe.sauce = sel.value ? parseInt(sel.value) : null;
  };
}

function renderSauceArchive() {
  const shelf = document.getElementById('sauce-shelf');
  shelf.innerHTML = '';
  S.sauceArchive.forEach(s => {
    if (s.fill <= 0 && !s.barrel) return;
    const wrap = document.createElement('div');
    wrap.className = 'vial-wrap';

    const el = document.createElement('div');
    el.className = 'vial';
    if (S.combineSelection.includes(s.id)) el.classList.add('selected');
    if (s.barrel) el.classList.add('barrel');

    if (s.barrel || s.fill >= 1) {
      el.style.background = rgb(s.color);
    } else {
      el.style.background = `linear-gradient(to top, ${rgb(s.color)} 50%, ${rgba(s.color, 0.15)} 50%)`;
      el.classList.add('half');
    }

    el.title = s.barrel ? `${s.name} (infinite)` : `${s.name} (${s.fill >= 1 ? 'full' : 'half'})`;

    const codeEl = document.createElement('div');
    codeEl.className = 'vial-name';
    codeEl.textContent = s.barrel ? s.code : s.code;
    codeEl.title = s.name;

    wrap.onclick = () => toggleCombineSelection(s.id);
    wrap.appendChild(el);
    if (s.barrel) {
      const tag = document.createElement('div');
      tag.className = 'barrel-label';
      tag.textContent = 'barrel';
      wrap.appendChild(tag);
    }
    wrap.appendChild(codeEl);
    shelf.appendChild(wrap);
  });
  renderSauceControls();
  renderSauceSelect();
}

function renderSauceControls() {
  const combineBtn = document.getElementById('combine-btn');
  const halfBtn = document.getElementById('drink-half-btn');
  const fullBtn = document.getElementById('drink-full-btn');
  const preview = document.getElementById('combine-preview');
  const label = document.getElementById('combine-label');

  const sel = S.combineSelection;
  const alive = sel.map(id => S.sauceArchive.find(s => s.id === id && (s.barrel || s.fill > 0))).filter(Boolean);

  // Combine: need exactly 2
  if (alive.length === 2) {
    const mixed = subtractMix(alive[0].color, alive[1].color);
    preview.style.background = rgb(mixed);
    preview.style.borderColor = 'var(--accent)';
    label.textContent = `${alive[0].name} + ${alive[1].name}`;
    combineBtn.disabled = false;
  } else {
    preview.style.background = 'transparent';
    preview.style.borderColor = 'var(--border)';
    combineBtn.disabled = true;
  }

  // Drink/Pour: need exactly 1
  if (alive.length === 1) {
    halfBtn.disabled = false;
    fullBtn.disabled = false;
    if (alive[0].barrel) {
      halfBtn.textContent = 'POUR HALF';
      fullBtn.textContent = 'POUR FULL';
      label.textContent = `${alive[0].name} (infinite)`;
    } else {
      halfBtn.textContent = 'SIP';
      fullBtn.textContent = 'DRINK';
      label.textContent = alive[0].name;
    }
  } else {
    halfBtn.disabled = true;
    fullBtn.disabled = true;
    halfBtn.textContent = 'SIP';
    fullBtn.textContent = 'DRINK';
  }

  if (alive.length === 0) {
    label.textContent = 'select vials to combine or drink';
  }
}

function renderSubmittedCards() {
  const section = document.getElementById('submitted-section');
  const container = document.getElementById('submitted-cards');
  if (S.recipes.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  container.innerHTML = '';
  S.recipes.forEach((r, i) => {
    const v = vesselById(r.vessel);
    const el = document.createElement('div');
    el.className = 'submitted-card';

    let layersHtml = '';
    r.layers.forEach(code => {
      const ing = ingredientByCode(code);
      layersHtml += `<span class="sc-layer-dot" style="background:${rgb(ing.color)}" title="${ing.name}"></span>`;
    });

    // Vessel name wears sauce color(s)
    let vesselColor = 'var(--ink)';
    let sauceLabel = '';
    if (r.sauce) {
      const s = S.sauceArchive.find(s => s.id === r.sauce);
      if (s) {
        vesselColor = rgb(s.color);
        sauceLabel = s.name;
      }
    }

    el.innerHTML = `
      <div class="sc-vessel" style="color:${vesselColor}" title="${sauceLabel}">${v.emoji} ${v.name}</div>
      <div class="sc-layers">${layersHtml}</div>
      <span class="sc-delete" onclick="deleteRecipe(${i})" title="Remove">\u2715</span>
    `;
    container.appendChild(el);
  });
}

function updateSubmitButton() {
  const btn = document.getElementById('submit-recipe-btn');
  btn.disabled = S.currentRecipe.layers.length === 0 || S.recipes.length >= 3;
}

/* ================================================================
   Interactions
   ================================================================ */

/* ── Drag ingredient to trough ─────────────────────── */

function startDrag(e, code) {
  e.preventDefault();
  const ing = ingredientByCode(code);
  S.drag.active = true;
  S.drag.code = code;

  const ghost = document.getElementById('drag-ghost');
  ghost.textContent = ing.emoji;
  ghost.classList.add('active');
  ghost.style.left = (e.clientX) + 'px';
  ghost.style.top = (e.clientY) + 'px';

  const src = document.querySelector(`.stock-item[data-code="${code}"]`);
  if (src) src.style.opacity = '0.3';
}

document.addEventListener('pointermove', (e) => {
  if (!S.drag.active) return;
  e.preventDefault();
  const ghost = document.getElementById('drag-ghost');
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';

  document.querySelectorAll('.trough:not(.filled)').forEach(tr => {
    const r = tr.getBoundingClientRect();
    const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    tr.classList.toggle('hover', over);
  });
});

document.addEventListener('pointerup', (e) => {
  if (!S.drag.active) return;
  S.drag.active = false;

  const ghost = document.getElementById('drag-ghost');
  ghost.classList.remove('active');
  document.querySelectorAll('.trough.hover').forEach(tr => tr.classList.remove('hover'));

  let placed = false;
  document.querySelectorAll('.trough:not(.filled)').forEach(tr => {
    if (placed) return;
    const r = tr.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      const slot = parseInt(tr.dataset.slot);
      S.troughs[slot].ingredient = S.drag.code;
      placed = true;
    }
  });

  renderTroughs();
  renderStock();
});

/* ── Trough -> Layer ─────────────────────────────────── */

function addLayerFromTrough(slot) {
  const t = S.troughs[slot];
  if (!t.ingredient) return;
  const v = vesselById(S.currentRecipe.vessel);
  if (S.currentRecipe.layers.length >= v.capacity + 2) return;
  S.currentRecipe.layers.push(t.ingredient);
  renderLayers();
}

function removeLayer(index) {
  S.currentRecipe.layers.splice(index, 1);
  renderLayers();
}

/* ── Clear trough ────────────────────────────────────── */

function clearTrough(slot) {
  S.troughs[slot].ingredient = null;
  renderTroughs();
  renderStock();
}

/* ── Recipe submit / clear ───────────────────────────── */

function submitRecipe() {
  if (S.currentRecipe.layers.length === 0) return;
  if (S.recipes.length >= 3) return;
  S.recipes.push({
    id: S.recipes.length,
    vessel: S.currentRecipe.vessel,
    layers: [...S.currentRecipe.layers],
    sauce: S.currentRecipe.sauce,
    status: 'submitted',
  });
  clearRecipe();
  renderSubmittedCards();
  updateSubmitButton();
}

function clearRecipe() {
  S.currentRecipe.layers = [];
  S.currentRecipe.sauce = null;
  document.getElementById('sauce-select').value = '';
  renderLayers();
}

function deleteRecipe(index) {
  S.recipes.splice(index, 1);
  renderSubmittedCards();
  updateSubmitButton();
}

/* ── Sauce selection / combine / drink ───────────────── */

function toggleCombineSelection(id) {
  const idx = S.combineSelection.indexOf(id);
  if (idx >= 0) {
    S.combineSelection.splice(idx, 1);
  } else {
    if (S.combineSelection.length >= 2) S.combineSelection.shift();
    S.combineSelection.push(id);
  }
  renderSauceArchive();
}

function combineSauces() {
  if (S.combineSelection.length !== 2) return;
  const a = S.sauceArchive.find(s => s.id === S.combineSelection[0]);
  const b = S.sauceArchive.find(s => s.id === S.combineSelection[1]);
  if (!a || !b) return;
  const mixed = subtractMix(a.color, b.color);
  const name = generateSauceName(mixed, 'combined');
  S.sauceArchive.push({
    id: nextSauceId++,
    color: mixed,
    fill: 1,
    barrel: false,
    origin: 'combined',
    name,
    code: generateSauceCode(name),
    day: S.day,
  });
  S.combineSelection = [];
  renderSauceArchive();
}

function drinkVial(amount) {
  if (S.combineSelection.length !== 1) return;
  const s = S.sauceArchive.find(s => s.id === S.combineSelection[0]);
  if (!s) return;

  if (s.barrel) {
    // Barrels pour a copy — never deplete
    const pourColor = amount === 'full' ? [...s.color] : halveColor(s.color);
    const pourOrigin = amount === 'full' ? 'combined' : 'halved';
    const pourName = generateSauceName(pourColor, pourOrigin);
    S.sauceArchive.push({
      id: nextSauceId++,
      color: pourColor,
      fill: amount === 'full' ? 1 : 0.5,
      barrel: false,
      origin: pourOrigin,
      name: pourName,
      code: generateSauceCode(pourName),
      day: S.day,
    });
  } else {
    // Finite vials deplete
    if (amount === 'full') {
      s.fill = 0;
    } else {
      if (s.fill <= 0.5) {
        s.fill = 0;
      } else {
        s.fill = 0.5;
        s.color = halveColor(s.color);
        s.name = generateSauceName(s.color, 'halved');
        s.code = generateSauceCode(s.name);
      }
    }
  }

  S.combineSelection = [];
  renderSauceArchive();
}

/* ================================================================
   Init
   ================================================================ */

function init() {
  initStarterSauces();
  renderTroughs();
  renderStock();
  renderVesselSelect();
  renderLayers();
  renderSauceArchive();
  renderSubmittedCards();

  hubMsg('hub:minimize');
  hubMsg('hub:color', { r: 240, g: 138, b: 40 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
