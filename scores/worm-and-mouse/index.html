// Note templates keyed by trigger condition
const NOTE_TEMPLATES = [
  {
    id: 'metal-floor',
    match: (rm) => rm.tile === 'metal' && rm.w * rm.h > 6,
    generate: (rm) => ({
      roomLabel: rm.label,
      text: `Metal floor in ${rm.label}. Mouse wants to slide. Worm skips it.`,
      optionA: { label: `Let Mouse use the metal`, shortLabel: 'Mouse slides', effect: { type: 'mouseInterval', delta: -300 } },
      optionB: { label: `Route around, stay quiet`, shortLabel: 'Route around', effect: { type: 'gnomeInterval', delta: 400 } },
      mousePrefers: 'A',
    }),
  },
  {
    id: 'hardware-room',
    match: (rm) => rm.tile === 'hardware',
    generate: (rm) => ({
      roomLabel: rm.label,
      text: `Heavy hardware in ${rm.label}. Noisy if we push through.`,
      optionA: { label: `Push through the hardware`, shortLabel: 'Push through', effect: { type: 'wormInterval', delta: -200 } },
      optionB: { label: `Find another way`, shortLabel: 'Go around', effect: { type: 'mouseInterval', delta: 200 } },
      mousePrefers: 'B',
    }),
  },
  {
    id: 'closet',
    match: (rm) => rm.w * rm.h <= 6,
    generate: (rm) => ({
      roomLabel: rm.label,
      text: `Tight space in ${rm.label}. One way in. Gnomes could block the door.`,
      optionA: { label: `Go in prepared, placate if needed`, shortLabel: 'Placate', effect: { type: 'mouseInterval', delta: 200 } },
      optionB: { label: `Hide and wait for a gap`, shortLabel: 'Hide', effect: { type: 'gnomeCount', delta: -1 } },
      mousePrefers: 'A',
    }),
  },
  {
    id: 'deep-objective',
    match: (rm, fl) => {
      const entry = fl.entry;
      const rmCenterCol = rm.x + Math.floor(rm.w / 2);
      const rmCenterRow = rm.y + Math.floor(rm.h / 2);
      const dist = Math.abs(rmCenterCol - entry.col) + Math.abs(rmCenterRow - entry.row);
      return dist > 8 && fl.objectives.some(o => o.col >= rm.x && o.col < rm.x + rm.w && o.row >= rm.y && o.row < rm.y + rm.h);
    },
    generate: (rm) => ({
      roomLabel: rm.label,
      text: `Objective deep in ${rm.label}. Long walk from entry. Direct or sweep?`,
      optionA: { label: `Direct approach, fast`, shortLabel: 'Direct', effect: { type: 'mouseInterval', delta: -200 } },
      optionB: { label: `Sweep wide, clear the path`, shortLabel: 'Sweep wide', effect: { type: 'gnomeInterval', delta: 200 } },
      mousePrefers: 'B',
    }),
  },
  {
    id: 'bottleneck',
    match: (rm, fl) => {
      // Room with only one door connection = bottleneck
      const doorCount = fl.doors.filter(d => d.r1 === fl.rooms.indexOf(rm) || d.r2 === fl.rooms.indexOf(rm)).length;
      return doorCount === 1 && rm.w * rm.h > 6;
    },
    generate: (rm) => ({
      roomLabel: rm.label,
      text: `Single entry to ${rm.label}. Bottleneck. Fast through or careful?`,
      optionA: { label: `Quick, commit to momentum`, shortLabel: 'Fast', effect: { type: 'wormInterval', delta: -300 } },
      optionB: { label: `Careful, check everything`, shortLabel: 'Careful', effect: { type: 'gnomeCount', delta: 1 } },
      mousePrefers: 'B',
    }),
  },
];

function generateBriefingNotes() {
  const fl = currentFloor();
  const notes = [];
  const usedRooms = new Set();
  const usedTemplates = new Set();

  // Collect all possible matches, then pick diverse set
  const candidates = [];
  for (const template of NOTE_TEMPLATES) {
    for (const rm of fl.rooms) {
      if (template.match(rm, fl)) {
        candidates.push({ template, rm });
      }
    }
  }

  // Shuffle to avoid always picking the same order
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  // Pick up to 3, preferring different templates and rooms
  for (const { template, rm } of candidates) {
    if (notes.length >= 3) break;
    if (usedRooms.has(rm.label)) continue;
    if (usedTemplates.has(template.id) && candidates.length > notes.length + 2) continue;
    const data = template.generate(rm, fl);
    const col = rm.x + Math.floor(rm.w / 2);
    const row = rm.y + Math.floor(rm.h / 2);
    notes.push({
      col, row,
      roomLabel: data.roomLabel,
      text: data.text,
      optionA: data.optionA,
      optionB: data.optionB,
      mousePrefers: data.mousePrefers,
      resolved: false,
      choice: null,
      appearT: 0,
      _seed: Math.random(),
    });
    usedRooms.add(rm.label);
    usedTemplates.add(template.id);
  }

  // Guarantee at least 2 notes — add a generic one if needed
  if (notes.length < 2) {
    const unusedRooms = fl.rooms.filter(rm => !usedRooms.has(rm.label) && rm.w * rm.h > 4);
    for (const rm of unusedRooms) {
      if (notes.length >= 2) break;
      const col = rm.x + Math.floor(rm.w / 2);
      const row = rm.y + Math.floor(rm.h / 2);
      notes.push({
        col, row,
        roomLabel: rm.label,
        text: `${rm.label} is larger than expected. Could be useful. Could be trouble.`,
        optionA: { label: `Explore it fully`, shortLabel: 'Explore', effect: { type: 'mouseInterval', delta: 200 } },
        optionB: { label: `Pass through quickly`, shortLabel: 'Quick pass', effect: { type: 'wormInterval', delta: -200 } },
        mousePrefers: 'A',
        resolved: false,
        choice: null,
        appearT: 0,
        _seed: Math.random(),
      });
      usedRooms.add(rm.label);
    }
  }

  return notes;
}

function generateBriefingLog(notes) {
  const fl = currentFloor();
  const queue = [];
  queue.push({ type: 'int', text: `BRIEFING // Floor ${S.floor + 1} of 3`, delay: 0 });
  queue.push({ type: 'pause', delay: 800 });

  // Find the entry room for Mouse's first line
  const entryRoom = fl.rooms.find(r =>
    fl.entry.col >= r.x && fl.entry.col < r.x + r.w &&
    fl.entry.row >= r.y && fl.entry.row < r.y + r.h
  );

  // Mouse line 1: what she confirmed (references a room she'd actually check)
  const confirmedRoom = fl.rooms[Math.floor(Math.random() * Math.min(3, fl.rooms.length))];
  const line1Pool = [
    `Mouse: Went through ${confirmedRoom.label}. ${confirmedRoom.tile}. Confirmed.`,
    `Mouse: ${confirmedRoom.label} is ${confirmedRoom.tile}. Counted the doors. We're fine.`,
    `Mouse: Checked ${confirmedRoom.label}. Quiet. ${confirmedRoom.tile} underfoot.`,
  ];
  queue.push({ type: 'agent', text: line1Pool[Math.floor(Math.random() * line1Pool.length)], delay: 1200 });

  // Mouse line 2: references something from the notes (what surprised her)
  if (notes.length > 0) {
    const n = notes[Math.floor(Math.random() * notes.length)];
    const line2Pool = [
      `Mouse: ${n.roomLabel} needs a decision. I have a preference.`,
      `Mouse: Something in ${n.roomLabel}. Not what I expected.`,
      `Mouse: ${n.roomLabel}. There's a call to make there.`,
    ];
    queue.push({ type: 'agent', text: line2Pool[Math.floor(Math.random() * line2Pool.length)], delay: 1200 });
  } else {
    queue.push({ type: 'agent', text: 'Mouse: Rooms are as briefed. Mostly.', delay: 1200 });
  }

  // Mouse line 3 (40% chance): entry orientation
  if (Math.random() < 0.4) {
    const entryName = entryRoom ? entryRoom.label : 'the south side';
    const line3Pool = [
      `Mouse: Entry from ${entryName}. Path exists.`,
      `Mouse: We go in through ${entryName}. I can work with that.`,
    ];
    queue.push({ type: 'agent', text: line3Pool[Math.floor(Math.random() * line3Pool.length)], delay: 1200 });
  }

  queue.push({ type: 'pause', delay: 600 });

  // Worm: 0-1 lines (50% silence)
  if (Math.random() < 0.5) {
    const wormPool = ['Worm: ...', 'Worm: paths laid.', 'Worm: ready.'];
    queue.push({ type: 'agent', text: wormPool[Math.floor(Math.random() * wormPool.length)], delay: 1000 });
  }

  queue.push({ type: 'pause', delay: 400 });
  queue.push({ type: 'int', text: `${notes.length} item${notes.length !== 1 ? 's' : ''} require${notes.length === 1 ? 's' : ''} your attention.`, delay: 800 });
  queue.push({ type: 'notes', delay: 200 });

  return queue;
}

function applyBriefingEffect(effect) {
  if (!effect) return;
  switch (effect.type) {
    case 'gnomeCount':
      if (effect.delta > 0) {
        // Add gnomes at random edges
        const edges = ['top', 'bottom', 'left', 'right'];
        for (let i = 0; i < effect.delta; i++) {
          const edge = edges[Math.floor(Math.random() * edges.length)];
          let gc, gr;
          if (edge === 'top')    { gc = Math.floor(Math.random() * GRID.cols); gr = 0; }
          if (edge === 'bottom') { gc = Math.floor(Math.random() * GRID.cols); gr = GRID.rows - 1; }
          if (edge === 'left')   { gc = 0; gr = Math.floor(Math.random() * GRID.rows); }
          if (edge === 'right')  { gc = GRID.cols - 1; gr = Math.floor(Math.random() * GRID.rows); }
          S.world.gnomes.push({
            col: gc, row: gr, presence: 0, edgeDir: edge,
            tickPhase: Math.random() * TAU, driftT: 0, alerted: false,
            trapping: null, trapTicks: 0,
            _bodyBumped: false, _onBody: false, _witnessed: false,
          });
        }
      } else if (effect.delta < 0 && S.world.gnomes.length > 1) {
        S.world.gnomes.splice(-1, Math.min(-effect.delta, S.world.gnomes.length - 1));
      }
      break;
    case 'tileSwap':
      if (S.world.tiles[effect.row] && S.world.tiles[effect.row][effect.col]) {
        S.world.tiles[effect.row][effect.col] = effect.newTile;
      }
      break;
    case 'mouseInterval':
      S.agents.mouse.tickInterval = Math.max(800, S.agents.mouse.tickInterval + effect.delta);
      break;
    case 'wormInterval':
      S.agents.worm.tickInterval = Math.max(600, S.agents.worm.tickInterval + effect.delta);
      break;
    case 'gnomeInterval':
      S.world.gnomeTickInterval = Math.max(1200, S.world.gnomeTickInterval + effect.delta);
      break;
  }
}

function startBriefingPhase() {
  // Generate world first — notes examine tile data
  generateWorld();

  const notes = generateBriefingNotes();
  const logQueue = generateBriefingLog(notes);

  S.phase = 'briefing';
  S.briefing.notes = notes;
  S.briefing.logQueue = logQueue;
  S.briefing.logIndex = 0;
  S.briefing.logTimer = 0;
  S.briefing.elapsed = 0;
  S.briefing.allResolved = false;
  S.briefing.mouseQueuePenalty = 0;
  S.briefing.notesAppearing = false;
  S.briefing.noteAppearIndex = 0;
  S.briefing.noteAppearTimer = 0;
  S.briefing.resolveDelay = 0;
  S.briefing.pendingEffects = [];

  // Hide planning UI
  document.getElementById('sticker-palette').style.opacity = '0';
  document.getElementById('sticker-palette').style.pointerEvents = 'none';
  document.getElementById('manifest').classList.remove('open');
  document.getElementById('manifest-toggle').style.display = 'none';
  clearLog();
  renderQueues();
}

function startPlanningPhase() {
  S.phase = 'planning';

  // Apply mouse queue penalty from briefing overrides
  S.agents.mouse.queueMax = Math.max(3, 7 - S.briefing.mouseQueuePenalty);

  // Collect effects for application at execution start
  S.briefing.pendingEffects = [];
  for (const note of S.briefing.notes) {
    if (note.choice) {
      const effect = note.choice === 'A' ? note.optionA.effect : note.optionB.effect;
      S.briefing.pendingEffects.push(effect);
    }
  }

  // Generate worm path for this floor
  generateWormPath();

  // Reset plan loop
  resetPlanLoop();

  // Show planning UI
  document.getElementById('sticker-palette').style.opacity = '1';
  document.getElementById('sticker-palette').style.pointerEvents = 'auto';
  document.getElementById('manifest-toggle').style.display = 'flex';
  clearLog();
  logInt(`PLANNING // Set room treatments. Loop runs when ready.`);
  buildManifest();
  renderQueues();
}

function updateBriefing(dt) {
  if (S.phase !== 'briefing') return;

  S.briefing.elapsed += dt;

  // Typewriter log lines
  if (S.briefing.logIndex < S.briefing.logQueue.length) {
    S.briefing.logTimer += dt;
    const entry = S.briefing.logQueue[S.briefing.logIndex];
    if (S.briefing.logTimer >= entry.delay) {
      S.briefing.logTimer = 0;
      if (entry.type === 'agent') logAgent(entry.text);
      else if (entry.type === 'int') logInt(entry.text);
      else if (entry.type === 'notes') S.briefing.notesAppearing = true;
      // 'pause' type just consumes delay
      S.briefing.logIndex++;
    }
  }

  // Staggered note appearance
  if (S.briefing.notesAppearing && S.briefing.noteAppearIndex < S.briefing.notes.length) {
    S.briefing.noteAppearTimer += dt;
    if (S.briefing.noteAppearTimer >= 400) {
      S.briefing.noteAppearTimer = 0;
      S.briefing.noteAppearIndex++;
    }
  }

  // Animate note fade-in
  for (let i = 0; i < S.briefing.notes.length; i++) {
    const note = S.briefing.notes[i];
    if (i < S.briefing.noteAppearIndex && note.appearT < 1) {
      note.appearT = Math.min(1, note.appearT + dt / 400);
    }
  }

  // Check all resolved → transition after delay
  if (!S.briefing.allResolved) {
    const allDone = S.briefing.notes.length > 0 && S.briefing.notes.every(n => n.resolved);
    if (allDone) {
      S.briefing.allResolved = true;
      S.briefing.resolveDelay = 0;
      logInt('// All items resolved.');
    }
  }
  if (S.briefing.allResolved) {
    S.briefing.resolveDelay += dt;
    if (S.briefing.resolveDelay >= 800) {
      startPlanningPhase();
    }
  }
}

// ===== AGENT AI =====
function neighbors(col, row) {
  return [
    { col: col - 1, row }, { col: col + 1, row },
    { col, row: row - 1 }, { col, row: row + 1 },
  ].filter(n => isWalkable(n.col, n.row));
}

function stickerWeight(col, row, agent, agentKey) {
  let w = 0;
  const range = agentKey === 'mouse' ? 5 : 2;
  for (const st of S.blueprint.stickers) {
    if (!st.resolved && S.phase === 'execution') continue;
    const dist = Math.abs(st.col - col) + Math.abs(st.row - row);
    const confMult = st.confidence === 'held' ? 1.5 : 1;

    switch (st.type) {
      case 'OBJECTIVE': {
        const objKey = cellKey(st.col, st.row);
        if (!agent.visited.has(objKey)) {
          // Strong local pull when nearby
          if (dist <= range) w += (range - dist + 2) * 3 * confMult;
          // Global compass: long-range pull toward unvisited objectives
          const fromAgent = Math.abs(st.col - agent.col) + Math.abs(st.row - agent.row);
          const fromCell = dist;
          if (fromCell < fromAgent) w += 6 * confMult;
          else if (fromCell > fromAgent) w -= 1;
          w += Math.max(0, 10 - fromCell * 0.3) * confMult;
        }
        // No pull toward already-visited objectives
        break;
      }
      case 'CAUTION':
        if (dist <= range) w -= (range - dist + 1) * 2 * agent.personality.caution * confMult;
        break;
      case 'WALL': if (dist === 0) w -= 100; break;
      case 'CLEAR':
        if (dist <= range) w += (range - dist + 1) * confMult;
        break;
      case 'TRUST_ME':
        if (dist <= 1) w += (S.run.trust + agent.personality.trust) * 3 * confMult;
        break;
      case 'CONTACT':
        if (dist === 0) w += 1;
        break;
    }
  }
  return w;
}

function agentThink(agent, agentKey) {
  const nbrs = neighbors(agent.col, agent.row);
  if (nbrs.length === 0) return;

  // Score each neighbor
  const scored = nbrs.map(n => {
    let score = 1; // base
    // Strongly prefer unvisited cells
    if (!agent.visited.has(cellKey(n.col, n.row))) score += 8;
    else score -= 3; // penalize re-exploring
    // Sticker influence
    score += stickerWeight(n.col, n.row, agent, agentKey);
    // Avoid going backward
    if (agent.queue.length > 0) {
      const last = agent.queue[agent.queue.length - 1];
      if (last && last.col === n.col && last.row === n.row) score -= 1;
    }
    return { ...n, score };
  });

  scored.sort((a, b) => b.score - a.score);

  // Build queue based on personality
  agent.queue = [];
  if (agentKey === 'mouse') {
    // Mouse: plan ahead, pick best path greedily
    let cur = { col: agent.col, row: agent.row };
    const planned = new Set([cellKey(cur.col, cur.row)]);
    for (let i = 0; i < agent.queueMax; i++) {
      const candidates = neighbors(cur.col, cur.row)
        .filter(n => !planned.has(cellKey(n.col, n.row)))
        .map(n => ({
          ...n,
          score: 1
            + (!agent.visited.has(cellKey(n.col, n.row)) ? 8 : -3)
            + stickerWeight(n.col, n.row, agent, agentKey)
        }))
        .sort((a, b) => b.score - a.score);

      if (candidates.length === 0) break;
      const pick = candidates[0];
      const tile = S.world.tiles[pick.row] && S.world.tiles[pick.row][pick.col];
      let action = 'MOVE';
      let subtag = pick.score > 4 ? 'target' : 'scan';
      if (tile === 'metal') { action = 'SLIDE'; subtag = 'metal'; }
      else if (tile === 'hardware') { action = 'CLIMB'; subtag = 'gear'; }
      else if (tile === 'cardboard') { action = 'PUSH'; subtag = 'box'; }

      agent.queue.push({
        action, col: pick.col, row: pick.row,
        emoji: CHIP_ACTIONS[action].emoji,
        subtag,
        color: CHIP_ACTIONS[action].color,
      });
      planned.add(cellKey(pick.col, pick.row));
      cur = pick;
    }
  } else {
    // Worm: impulsive, short queue, semi-random from top options
    const top = scored.slice(0, Math.min(3, scored.length));
    const count = 1 + Math.floor(Math.random() * agent.queueMax);
    let cur = { col: agent.col, row: agent.row };
    for (let i = 0; i < count; i++) {
      let pick;
      if (i === 0) {
        // First move: weighted random from top
        const r = Math.random();
        pick = r < 0.5 ? top[0] : top[Math.floor(Math.random() * top.length)];
      } else {
        const nxt = neighbors(cur.col, cur.row);
        pick = nxt[Math.floor(Math.random() * nxt.length)];
      }
      if (!pick) break;

      const tile = S.world.tiles[pick.row] && S.world.tiles[pick.row][pick.col];
      let action = 'BURROW';
      let subtag = '';
      if (tile === 'paper') { action = 'BURROW'; subtag = 'tear'; }
      else if (tile === 'metal') { action = 'BURROW'; subtag = 'fast'; }
      else if (tile === 'wood') { action = 'BURROW'; subtag = 'loud'; }
      else { subtag = 'dig'; }

      agent.queue.push({
        action, col: pick.col, row: pick.row,
        emoji: CHIP_ACTIONS[action].emoji,
        subtag,
        color: CHIP_ACTIONS[action].color,
      });
      cur = pick;
    }
  }
}

function agentStep(agent, agentKey) {
  if (agent.queue.length === 0) {
    agentThink(agent, agentKey);
    if (agent.queue.length === 0) return;
  }

  const chip = agent.queue.shift();
  agent.targetCol = chip.col;
  agent.targetRow = chip.row;
  agent.moveT = 0;

  // Mark visited
  agent.visited.add(cellKey(chip.col, chip.row));

  // Reveal tile
  const tile = S.world.tiles[chip.row] && S.world.tiles[chip.row][chip.col];
  if (tile) {
    S.blueprint.revealed.add(cellKey(chip.col, chip.row));
  }

  // Worm body extension + trail
  if (agentKey === 'worm') {
    // Visual trail (fading recent movement)
    agent.trail.push({ col: agent.col, row: agent.row, age: 0 });
    if (agent.trail.length > agent.trailMax) agent.trail.shift();

    // Persistent body — worm grows as it burrows
    const key = cellKey(chip.col, chip.row);
    if (!agent.body.has(key)) {
      agent.body.add(key);
      agent.bodyOrder.push(key);
    }
  }

  // Generate reports
  if (agentKey === 'mouse') {
    // Mouse reports thoughtfully, not every step
    if (tile && Math.random() < 0.3) {
      const rm = roomAt(chip.col, chip.row);
      const msgs = [
        `${tile} underfoot.${rm ? ' ' + rm.label + '.' : ''}`,
        `Noted: ${tile} tiles here.`,
        `Checking ${rm ? rm.label : 'area'}. ${tile}.`,
        `Moving through. ${tile} surface.`,
      ];
      logAgent(msgs[Math.floor(Math.random() * msgs.length)]);
    }
    // Report on sticker arrival
    for (const st of S.blueprint.stickers) {
      if (st.col === chip.col && st.row === chip.row && st.resolved) {
        if (st.type === 'OBJECTIVE') logAgent('On target. Searching.');
        if (st.type === 'CAUTION') logAgent('Noted your caution. Proceeding carefully.');
        if (st.type === 'TRUST_ME') {
          if (S.run.trust > 0.5) logAgent('Understood, HQ.');
          else logAgent('Repeat, HQ? Trust sticker here but... okay.');
        }
      }
    }
    // Refresh queue periodically
    if (agent.queue.length < 3) {
      agentThink(agent, agentKey);
      if (agent._pulseT === undefined) agent._pulseT = 0;
      agent._pulseT = 600;
    }
  } else {
    // Worm: terse, physical, steady
    if (Math.random() < 0.15) {
      const bodyLen = agent.body.size;
      const msgs = [
        'through.', tile ? tile + '.' : 'dark.', 'extending.',
        bodyLen > 8 ? 'long now.' : 'growing.',
        tile === 'metal' ? 'metal. good.' : 'digging.',
        tile === 'wood' ? 'splinters.' : 'steady.',
      ];
      logAgent(msgs[Math.floor(Math.random() * msgs.length)]);
    }
    // Worm always rebuilds queue
    agentThink(agent, agentKey);
  }

  renderQueues();
}

// ===== GNOME CONVERSATION TOPICS =====
const GNOME_TOPICS = [
  { opener: 'Hey, do you know where the toner is?', duration: 4 },
  { opener: 'The fax machine is doing that thing again.', duration: 3 },
  { opener: 'Did you see the memo about recycling policy?', duration: 5 },
  { opener: 'I think someone left the lights on in Records.', duration: 3 },
  { opener: 'Have you signed the birthday card for Janet?', duration: 2 },
  { opener: 'Is it just me or is the thermostat broken?', duration: 4 },
  { opener: 'Filing system changed again. Nobody told me.', duration: 3 },
  { opener: 'You look lost. This floor is confusing.', duration: 3 },
];

// ===== GNOME SYSTEM =====
function gnomeTick() {
  const worm = S.agents.worm;

  for (const g of S.world.gnomes) {
    g.tickPhase += 0.3 + Math.random() * 0.2;
    g.driftT += 1;

    // Slowly increase presence
    if (g.presence < 1) {
      g.presence += 0.08 + Math.random() * 0.05;
      g.presence = Math.min(1, g.presence);
    }

    // Release agents from conversation
    if (g.trapping) {
      g.trapTicks--;
      if (g.trapTicks <= 0) {
        g.trapping = null;
        logInt(`conversation ended.`);
      }
    }

    // Movement: drift inward from edges, mill around rooms, avoid worm body
    if (!g.trapping && g.presence >= 0.5 && Math.random() < 0.4) {
      let newCol = g.col, newRow = g.row;
      // Bias toward center of the floor (drift inward)
      const centerCol = GRID.cols / 2, centerRow = GRID.rows / 2;
      if (Math.random() < 0.5) {
        // Drift toward center
        newCol += g.col < centerCol ? 1 : g.col > centerCol ? -1 : (Math.random() < 0.5 ? 1 : -1);
        if (Math.random() < 0.3) newRow += g.row < centerRow ? 1 : -1;
      } else {
        // Random mill
        const dir = Math.random() < 0.5 ? -1 : 1;
        if (Math.random() < 0.5) newCol += dir; else newRow += dir;
      }
      newCol = Math.max(0, Math.min(GRID.cols - 1, newCol));
      newRow = Math.max(0, Math.min(GRID.rows - 1, newRow));
      // Worm body blocks gnome movement
      const targetKey = cellKey(newCol, newRow);
      if (worm.body.has(targetKey)) {
        // Gnome bumps into worm body — blocked, maybe confused
        if (!g._bodyBumped) {
          g._bodyBumped = true;
          logInt(`gnome tripped on something. rerouting.`);
        }
        // Try perpendicular instead
        if (newCol !== g.col) {
          newRow = Math.max(0, Math.min(GRID.rows - 1, g.row + (Math.random() < 0.5 ? 1 : -1)));
          newCol = g.col;
        } else {
          newCol = Math.max(0, Math.min(GRID.cols - 1, g.col + (Math.random() < 0.5 ? 1 : -1)));
          newRow = g.row;
        }
        if (worm.body.has(cellKey(newCol, newRow))) {
          // Completely blocked — stay put
          newCol = g.col;
          newRow = g.row;
        }
      } else {
        g._bodyBumped = false;
      }
      g.col = newCol;
      g.row = newRow;
    }

    // Detect agent proximity — initiate conversation trap
    if (g.presence >= 0.5 && !g.trapping) {
      for (const [agentKey, agent] of Object.entries(S.agents)) {
        if (!agent.active) continue;
        if (agent._trapped) continue; // already trapped by another gnome
        const dist = Math.abs(g.col - agent.col) + Math.abs(g.row - agent.row);
        if (dist <= 1) {
          // Worm body between gnome and agent blocks the trap
          if (agentKey === 'mouse') {
            const midKey = cellKey(
              Math.round((g.col + agent.col) / 2),
              Math.round((g.row + agent.row) / 2)
            );
            if (dist === 1 && worm.body.has(midKey)) {
              logInt('worm body shielded mouse from conversation.');
              continue;
            }
            // Also check if worm body is on gnome's cell
            if (worm.body.has(cellKey(g.col, g.row))) {
              logInt('gnome tangled in worm. mouse slips past.');
              continue;
            }
          }
          // Initiate conversation trap
          const topic = GNOME_TOPICS[Math.floor(Math.random() * GNOME_TOPICS.length)];
          g.trapping = agentKey;
          g.trapTicks = topic.duration;
          agent._trapped = true;
          agent._trapTicks = topic.duration;
          logAgent(`${agentKey === 'mouse' ? 'Someone is talking to me.' : 'stuck.'}`);
          logInt(`GNOME: "${topic.opener}"`);

          if (agentKey === 'mouse') {
            // Mouse freezes — queue pauses but she's aware
            if (Math.random() < 0.5) {
              logAgent('Nodding. Waiting for an opening.');
            }
          }
        }
      }
    }

    // Worm body tripwire detection — gnome crosses worm body
    if (g.presence >= 0.5) {
      const gKey = cellKey(g.col, g.row);
      if (worm.body.has(gKey) && !g._onBody) {
        g._onBody = true;
        logInt(`TRIPWIRE: gnome at (${g.col},${g.row}). Worm felt it.`);
        // Worm notices — brief report
        if (Math.random() < 0.7) {
          logAgent('felt something. body tremor.');
        }
      } else if (!worm.body.has(gKey)) {
        g._onBody = false;
      }
    }

    // React to nearby stickers (dimensional pressure)
    for (const st of S.blueprint.stickers) {
      const dist = Math.abs(st.col - g.col) + Math.abs(st.row - g.row);
      if (dist < 4 && !st._gnomeReacted) {
        g.tickPhase += 1.5;
        st._gnomeReacted = true;
      }
    }

    // First full presence = witness moment
    if (g.presence >= 0.5 && !g._witnessed) {
      g._witnessed = true;
      triggerWitness('Edge disturbance resolved. Something is inside.');
    }
  }
}

// ===== WITNESS SYSTEM =====
function triggerWitness(text) {
  if (S.phase !== 'execution') return;
  S.paused = true;
  const overlay = document.getElementById('witness-overlay');
  const textEl = document.getElementById('witness-text');
  textEl.textContent = text;
  overlay.classList.add('active');
  logInt('// PAUSE FOR WITNESS');
}

document.getElementById('witness-overlay').addEventListener('click', () => {
  S.paused = false;
  document.getElementById('witness-overlay').classList.remove('active');
  if (S._pendingFloorTransition) {
    S._pendingFloorTransition = false;
    startBetweenFloors();
  }
});

// ===== QUEUE RENDERING =====
function renderQueues() {
  renderQueue('mouse');
  renderQueue('worm');
}

function renderQueue(agentKey) {
  const agent = S.agents[agentKey];
  const lane = document.getElementById('queue-' + agentKey);
  const label = lane.querySelector('.queue-lane-label');

  // Clear non-label children
  while (lane.children.length > 1) lane.removeChild(lane.lastChild);

  if (!agent.active) {
    const ph = document.createElement('span');
    ph.className = 'queue-placeholder';
    ph.textContent = 'Awaiting dispatch...';
    lane.appendChild(ph);
    return;
  }

  if (agent.queue.length === 0) {
    const ph = document.createElement('span');
    ph.className = 'queue-placeholder';
    ph.textContent = agentKey === 'mouse' ? 'Reassessing...' : 'moving...';
    lane.appendChild(ph);
    return;
  }

  for (let i = 0; i < agent.queue.length; i++) {
    const chip = agent.queue[i];
    const el = document.createElement('div');
    el.className = 'queue-chip';
    const baseColor = agentKey === 'mouse' ? '#4a6a8a' : '#8a5a3a';
    el.style.background = baseColor + (i === 0 ? '33' : '1a');
    el.style.border = `1px solid ${baseColor}${i === 0 ? '66' : '33'}`;
    el.innerHTML = `<span>${chip.emoji}</span><span class="chip-subtag">${chip.subtag}</span>`;
    if (i === 0) el.style.boxShadow = `0 0 6px ${baseColor}33`;

    // Tap to query
    el.addEventListener('click', () => {
      if (S.phase !== 'execution') return;
      // "Are you sure?" — agent re-evaluates
      logInt(`QUERY: ${agentKey} chip ${i} — ${chip.action}`);
      if (agentKey === 'mouse') {
        // Mouse respects queries
        if (Math.random() < 0.6) {
          logAgent('Reconsidering...');
          agentThink(agent, agentKey);
          renderQueues();
        } else {
          logAgent('Confirmed. Proceeding.');
        }
      } else {
        // Worm mostly ignores
        if (Math.random() < 0.15) {
          logAgent('...fine.');
          agentThink(agent, agentKey);
          renderQueues();
        } else {
          logAgent('committed.');
        }
      }
    });

    lane.appendChild(el);
  }
}

// ===== PHASE MANAGEMENT =====
// startExecutionPhase removed — transitionToExecution() handles the seamless send

function startBetweenFloors() {
  S.floor++;
  S._floorComplete = false;

  if (S.floor >= 3) {
    // Cabinet complete
    logInt('CABINET COMPLETE. All floors cleared.');
    S.run.trust = Math.min(1, S.run.trust + 0.1);
    save();
    return;
  }

  // Reset for next floor
  S.blueprint.stickers = [];
  S.blueprint.pins = [];
  S.blueprint.revealed = new Set();
  S.blueprint.nodes = {};
  S.blueprint.wormPath = [];
  S.run.pinsPlaced = { FILE: 0, KEY: 0, INTEL: 0 };

  for (const key of ['mouse', 'worm']) {
    const a = S.agents[key];
    a.active = false;
    a.queue = [];
    a.visited = new Set();
    a.tickInterval = key === 'mouse' ? 1800 : 1300; // reset from briefing effects
    a.queueMax = key === 'mouse' ? 7 : 3;
    if (key === 'worm') { a.trail = []; a.body = new Set(); a.bodyOrder = []; }
  }
  S.world.gnomeTickInterval = 2800; // reset

  // Enter briefing for next floor
  startBriefingPhase();
}

// ===== CHECK FLOOR COMPLETION =====
function checkFloorComplete() {
  if (S.phase !== 'execution') return false;
  const fl = currentFloor();

  // All objectives must be reached
  for (const obj of fl.objectives) {
    const key = cellKey(obj.col, obj.row);
    if (!S.agents.mouse.visited.has(key) && !S.agents.worm.visited.has(key)) {
      return false;
    }
  }

  // Key is a bonus — floor completes on objectives + sufficient exploration
  const totalCells = fl.rooms.reduce((sum, rm) => sum + rm.w * rm.h, 0);
  const explored = S.agents.mouse.visited.size + S.agents.worm.visited.size;
  // Deduplicate: count unique visited cells
  const allVisited = new Set([...S.agents.mouse.visited, ...S.agents.worm.visited]);
  const coverage = allVisited.size / totalCells;

  // Complete when objectives hit and at least 40% explored
  return coverage >= 0.4;
}

// ===== MAIN LOOP =====
let lastTime = 0;
function frame(time) {
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;

  if (dt > 0) update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt) {
  // Briefing phase update
  if (S.phase === 'briefing') { updateBriefing(dt); return; }

  // Planning phase: run the planning loop
  if (S.phase === 'planning') { updatePlanLoop(dt); return; }

  if (S.phase !== 'execution' || S.paused) return;

  // Gnome tick
  S.world.gnomeTick += dt;
  if (S.world.gnomeTick >= S.world.gnomeTickInterval) {
    S.world.gnomeTick -= S.world.gnomeTickInterval;
    gnomeTick();
  }

  // Mouse tick
  const mouse = S.agents.mouse;
  if (mouse.active) {
    // Conversation trap countdown
    if (mouse._trapped && mouse._trapTicks > 0) {
      mouse._trapTicks--;
      if (mouse._trapTicks <= 0) {
        mouse._trapped = false;
        logAgent('Excuse me. Moving on.');
      }
    }
    mouse.tickAccum += dt;
    if (mouse.tickAccum >= mouse.tickInterval) {
      mouse.tickAccum -= mouse.tickInterval;
      if (!mouse._trapped) agentStep(mouse, 'mouse');
    }
    // Interpolate position
    if (mouse.moveT < 1) {
      mouse.moveT = Math.min(1, mouse.moveT + dt / 350);
      const from = gridToCanvas(mouse.col + 0.5, mouse.row + 0.5);
      const to = gridToCanvas(mouse.targetCol + 0.5, mouse.targetRow + 0.5);
      const t = mouse.moveT * mouse.moveT * (3 - 2 * mouse.moveT); // smoothstep
      mouse.x = from.x + (to.x - from.x) * t;
      mouse.y = from.y + (to.y - from.y) * t;
      if (mouse.moveT >= 1) {
        mouse.col = mouse.targetCol;
        mouse.row = mouse.targetRow;
      }
    }
    // Pulse decay
    if (mouse._pulseT > 0) mouse._pulseT -= dt;
  }

  // Worm tick
  const worm = S.agents.worm;
  if (worm.active) {
    // Worm mostly ignores conversation — head pauses but briefly
    if (worm._trapped && worm._trapTicks > 0) {
      worm._trapTicks--;
      if (worm._trapTicks <= 0) {
        worm._trapped = false;
        logAgent('...moving.');
      }
    }
    worm.tickAccum += dt;
    if (worm.tickAccum >= worm.tickInterval) {
      worm.tickAccum -= worm.tickInterval;
      if (!worm._trapped) agentStep(worm, 'worm');
    }
    if (worm.moveT < 1) {
      // Steady crawl — uses most of the tick interval to traverse
      worm.moveT = Math.min(1, worm.moveT + dt / 1000);
      const from = gridToCanvas(worm.col + 0.5, worm.row + 0.5);
      const to = gridToCanvas(worm.targetCol + 0.5, worm.targetRow + 0.5);
      const t = worm.moveT; // linear — no easing, just steady
      worm.x = from.x + (to.x - from.x) * t;
      worm.y = from.y + (to.y - from.y) * t;
      if (worm.moveT >= 1) {
        worm.col = worm.targetCol;
        worm.row = worm.targetRow;
      }
    }
    // Trail aging
    for (const t of worm.trail) t.age += dt;
    worm.trail = worm.trail.filter(t => t.age < 5000);
  }

  // Resolve gnomaction stickers
  for (const st of S.blueprint.stickers) {
    if (!st.resolved) {
      st.gnomactionT += dt;
      if (st.gnomactionT >= 800) st.resolved = true;
    }
  }

  // Check floor completion
  if (!S._floorComplete && checkFloorComplete()) {
    S._floorComplete = true;
    // Check if key was also found (bonus)
    const fl = currentFloor();
    const keyKey = cellKey(fl.keyPos.col, fl.keyPos.row);
    const keyFound = S.agents.mouse.visited.has(keyKey) || S.agents.worm.visited.has(keyKey);
    const msg = keyFound
      ? `Floor ${S.floor + 1} cleared. Objectives secured. Key recovered.`
      : `Floor ${S.floor + 1} cleared. Objectives secured.`;
    triggerWitness(msg);
    S._pendingFloorTransition = true;
  }
}

function render() {
  drawBlueprint();
  if (S.phase === 'briefing') drawBriefingNotes();
  if (S.phase === 'planning') drawPlanLoop();
  drawLiveSignal();
}

// ===== BRIEFING NOTES RENDERING =====
function drawBriefingNotes() {
  const gp = S.ui.gridPx;
  const notes = S.briefing.notes;

  for (let i = 0; i < notes.length; i++) {
    const note = notes[i];
    if (note.appearT <= 0) continue;

    const alpha = note.appearT;
    const slideY = (1 - note.appearT) * 8; // slide up as appearing

    ctx.save();

    // Note position — offset from room center
    const cx = S.ui.gridOx + (note.col + 0.5) * gp;
    const cy = S.ui.gridOy + (note.row + 0.5) * gp - slideY;

    // Note dimensions in canvas pixels
    const nw = Math.min(gp * 3.2, 160);
    const nh = Math.min(gp * 2.4, 100);
    const nx = cx - nw / 2;
    const ny = cy - nh / 2;

    // Store bounds for hit testing
    note._bounds = { x: nx, y: ny, w: nw, h: nh };

    ctx.globalAlpha = alpha;

    // Slight rotation
    const rot = (note._seed - 0.5) * 0.06;
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.translate(-cx, -cy);

    // Shadow
    ctx.shadowColor = 'rgba(26,26,24,0.15)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;

    // Paper rectangle
    const paperColor = note.resolved ? '#ddd8c8' : '#eee8c8';
    ctx.fillStyle = paperColor;
    ctx.fillRect(nx, ny, nw, nh);
    ctx.shadowColor = 'transparent';

    // Border
    ctx.strokeStyle = 'rgba(90,106,74,0.3)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(nx, ny, nw, nh);

    // Situation text (top area)
    ctx.fillStyle = '#2a2a18';
    ctx.font = 'italic 9px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    // Word-wrap the situation text
    const textPad = 6;
    const maxTextW = nw - textPad * 2;
    const words = note.text.split(' ');
    let lines = [];
    let currentLine = '';
    for (const word of words) {
      const test = currentLine ? currentLine + ' ' + word : word;
      if (ctx.measureText(test).width > maxTextW && currentLine) {
        lines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = test;
      }
    }
    if (currentLine) lines.push(currentLine);
    lines = lines.slice(0, 3); // max 3 lines

    for (let l = 0; l < lines.length; l++) {
      ctx.fillText(lines[l], nx + textPad, ny + textPad + l * 11);
    }

    // Divider
    const divY = ny + textPad + lines.length * 11 + 4;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(nx + textPad, divY);
    ctx.lineTo(nx + nw - textPad, divY);
    ctx.strokeStyle = 'rgba(90,106,74,0.4)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.setLineDash([]);

    // Options area
    const optY = divY + 6;
    const halfW = nw / 2;
    ctx.font = '8px "Courier New", monospace';

    // Option A (left)
    const aAlpha = note.resolved && note.choice !== 'A' ? 0.3 : 1;
    ctx.globalAlpha = alpha * aAlpha;
    ctx.fillStyle = '#2a2a18';
    ctx.textAlign = 'center';

    // Strike-through unchosen option
    if (note.resolved && note.choice !== 'A') {
      const aText = note.optionA.shortLabel;
      const aX = nx + halfW * 0.5;
      ctx.fillText(aText, aX, optY);
      const tw = ctx.measureText(aText).width;
      ctx.beginPath();
      ctx.moveTo(aX - tw / 2, optY + 4);
      ctx.lineTo(aX + tw / 2, optY + 4);
      ctx.strokeStyle = '#b04030';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    } else {
      ctx.fillText(note.optionA.shortLabel, nx + halfW * 0.5, optY);
    }

    // Option B (right)
    const bAlpha = note.resolved && note.choice !== 'B' ? 0.3 : 1;
    ctx.globalAlpha = alpha * bAlpha;

    if (note.resolved && note.choice !== 'B') {
      const bText = note.optionB.shortLabel;
      const bX = nx + halfW * 1.5;
      ctx.fillText(bText, bX, optY);
      const tw = ctx.measureText(bText).width;
      ctx.beginPath();
      ctx.moveTo(bX - tw / 2, optY + 4);
      ctx.lineTo(bX + tw / 2, optY + 4);
      ctx.strokeStyle = '#b04030';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    } else {
      ctx.fillText(note.optionB.shortLabel, nx + halfW * 1.5, optY);
    }

    // Chosen option check mark
    if (note.resolved) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#4a8a4a';
      ctx.font = '10px sans-serif';
      const checkX = note.choice === 'A' ? nx + halfW * 0.5 + 24 : nx + halfW * 1.5 + 24;
      ctx.fillText('\u2713', checkX, optY + 1);
    }

    // Mouse preference indicator
    ctx.globalAlpha = alpha * 0.6;
    if (note.mousePrefers && !note.resolved) {
      ctx.fillStyle = '#4a6a8a';
      ctx.font = 'italic 7px "Courier New", monospace';
      ctx.textAlign = 'left';
      const mX = note.mousePrefers === 'A' ? nx + 4 : nx + halfW + 4;
      const mY = optY + 12;
      ctx.fillText('M\u2191', mX, mY);
    }

    // Vertical divider between options
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath();
    ctx.moveTo(nx + halfW, divY + 2);
    ctx.lineTo(nx + halfW, ny + nh - 4);
    ctx.strokeStyle = 'rgba(90,106,74,0.4)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.restore();
  }
}

// ===== INIT =====
buildPalette();
buildManifest();
startBriefingPhase();
requestAnimationFrame(frame);
</script>
