<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worm & Mouse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#e8e0cc;--paper-dark:#d8d0bc;--ink:#1a1a18;--mold:#5a6a4a;
  --mold-light:#7a8a6a;--mold-faint:rgba(90,106,74,0.12);
  --trace:#3a4a2a;--stamp:#b04030;--brass:#8a7a50;
  --chip-mouse:#4a6a8a;--chip-worm:#8a5a3a;
  --log-agent:#2a2a18;--log-int:#5a6a4a;
  --dim:rgba(26,26,24,0.35);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);touch-action:none;user-select:none;font-family:'Courier New',monospace;color:var(--ink)}

/* ── Layout ── */
#layout{display:grid;width:100%;height:100%;grid-template-rows:1fr auto auto;grid-template-columns:1fr auto}
#bp-wrap{position:relative;grid-column:1;grid-row:1;overflow:hidden;min-height:0}
#bp{display:block;width:100%;height:100%}
#manifest{grid-column:2;grid-row:1;width:0;overflow:hidden;transition:width 0.25s;background:var(--paper-dark);border-left:1px solid var(--mold-faint)}
#manifest.open{width:160px;padding:10px 8px}
#manifest h3{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--mold);margin-bottom:8px}
.pin-slot{display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:4px;border:1px solid var(--mold-faint);border-radius:3px;cursor:pointer;font-size:11px;transition:background 0.15s}
.pin-slot:hover{background:var(--mold-faint)}
.pin-slot.empty{opacity:0.35;cursor:default}
.pin-emoji{font-size:14px}
.pin-count{margin-left:auto;font-size:9px;color:var(--mold-light)}
#manifest-toggle{position:absolute;top:8px;right:8px;z-index:5;width:28px;height:28px;border:1px solid var(--mold-faint);border-radius:3px;background:var(--paper-dark);color:var(--mold);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}

/* ── Queue strip ── */
#queue-strip{grid-column:1/-1;grid-row:2;display:flex;gap:8px;padding:6px 10px;border-top:1px solid var(--mold-faint);background:var(--paper-dark);min-height:52px}
.queue-lane{flex:1;display:flex;align-items:center;gap:4px;overflow-x:auto}
.queue-lane-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);writing-mode:vertical-lr;transform:rotate(180deg);margin-right:4px;flex-shrink:0}
.queue-chip{display:inline-flex;flex-direction:column;align-items:center;padding:4px 7px;border-radius:4px;font-size:13px;min-width:32px;transition:opacity 0.2s,transform 0.15s;cursor:pointer;flex-shrink:0}
.queue-chip:hover{transform:translateY(-1px)}
.chip-subtag{font-size:7px;letter-spacing:0.5px;opacity:0.7;margin-top:1px}
.queue-placeholder{font-size:10px;color:var(--dim);font-style:italic}

/* ── Log thread ── */
#log-thread{grid-column:1/-1;grid-row:3;display:flex;gap:0;border-top:1px solid var(--mold-faint);background:rgba(26,26,24,0.04);height:72px;overflow:hidden}
#log-agent{flex:1;padding:6px 10px;overflow-y:auto;font-size:11px;color:var(--log-agent);line-height:1.5}
#log-int{flex:1;padding:6px 10px;overflow-y:auto;font-size:10px;color:var(--log-int);font-family:'Courier New',monospace;text-align:right;opacity:0.7;line-height:1.5}
.log-line{animation:logIn 0.3s ease}
@keyframes logIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Sticker palette ── */
#sticker-palette{position:absolute;bottom:8px;left:8px;z-index:10;display:flex;gap:4px;padding:5px 6px;background:rgba(232,224,204,0.92);border:1px solid var(--mold-faint);border-radius:4px;backdrop-filter:blur(4px)}
.sticker-btn{display:flex;flex-direction:column;align-items:center;padding:4px 6px;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:14px;transition:border-color 0.15s,background 0.15s;background:none;font-family:inherit}
.sticker-btn:hover{border-color:var(--mold-light);background:var(--mold-faint)}
.sticker-btn.selected{border-color:var(--mold);background:rgba(90,106,74,0.18)}
.sticker-label{font-size:6px;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim);margin-top:2px}

/* ── Drag ghost ── */
#drag-ghost{position:fixed;z-index:100;pointer-events:none;font-size:22px;opacity:0.85;transform:translate(-50%,-50%) scale(1.1);display:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))}

/* send button removed — the loop IS the send */

/* ── Witness overlay ── */
#witness-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,transparent 40%,rgba(26,26,24,0.3));cursor:pointer}
#witness-overlay.active{display:flex}
#witness-text{color:var(--ink);font-size:13px;text-align:center;max-width:320px;line-height:1.6;padding:20px;background:rgba(232,224,204,0.95);border:1px solid var(--mold-faint);border-radius:4px}
</style>
</head>
<body>
<div id="layout">
  <div id="bp-wrap">
    <canvas id="bp"></canvas>
    <button id="manifest-toggle">P</button>
    <div id="sticker-palette"></div>
    <!-- send is the loop completing clean twice -->
    <div id="drag-ghost"></div>
  </div>
  <div id="manifest"></div>
  <div id="queue-strip">
    <div class="queue-lane" id="queue-mouse"><span class="queue-lane-label">MOUSE</span><span class="queue-placeholder">Awaiting dispatch...</span></div>
    <div class="queue-lane" id="queue-worm"><span class="queue-lane-label">WORM</span><span class="queue-placeholder">Awaiting dispatch...</span></div>
  </div>
  <div id="log-thread">
    <div id="log-agent"></div>
    <div id="log-int"></div>
  </div>
</div>
<div id="witness-overlay"><div id="witness-text"></div></div>

<script>
// ===== HUB INTEGRATION =====
try { window.parent.postMessage({ type: 'hub:minimize' }, '*'); } catch(e) {}
try { window.parent.postMessage({ type: 'hub:color', r: 90, g: 105, b: 75 }, '*'); } catch(e) {}

// ===== CONSTANTS =====
const TAU = Math.PI * 2;
const GRID = { cols: 12, rows: 10 };

const STICKER_TYPES = {
  OBJECTIVE: { emoji: '\u{1F3AF}', color: '#b04030', label: 'OBJ' },
  CAUTION:   { emoji: '\u26A0\uFE0F', color: '#c0a020', label: 'CAUT' },
  WALL:      { emoji: '\u{1F9F1}', color: '#6a5a4a', label: 'WALL' },
  CLEAR:     { emoji: '\u2705', color: '#4a8a4a', label: 'CLR' },
  TRUST_ME:  { emoji: '\u{1F91D}', color: '#4a6a8a', label: 'TRST' },
  CONTACT:   { emoji: '\u{1F4E1}', color: '#7a5a8a', label: 'CNTC' },
};

const PIN_DEFS = {
  FILE:  { emoji: '\u{1F4C4}', label: 'File', max: 1 },
  KEY:   { emoji: '\u{1F511}', label: 'Key', max: 1 },
  INTEL: { emoji: '\u{1F4CC}', label: 'Intel', max: 2 },
};

const CHIP_ACTIONS = {
  MOVE:   { emoji: '\u{1F43E}', color: 'var(--chip-mouse)', label: 'move' },
  SLIDE:  { emoji: '\u2744\uFE0F', color: '#5a8a7a', label: 'slide' },
  SEARCH: { emoji: '\u{1F50D}', color: '#6a6a8a', label: 'search' },
  CLIMB:  { emoji: '\u{1FA9C}', color: '#8a7a5a', label: 'climb' },
  BURROW: { emoji: '\u{1F4A5}', color: 'var(--chip-worm)', label: 'burrow' },
  PUSH:   { emoji: '\u{1F4E6}', color: '#7a6a5a', label: 'push' },
  WAIT:   { emoji: '\u23F8\uFE0F', color: '#888', label: 'wait' },
  REACT:  { emoji: '\u26A1', color: '#aa6a3a', label: 'react' },
};

const TILE_TYPES = {
  metal:    { hardness: 0.8, noise: 0.3 },
  paper:    { hardness: 0.1, noise: 0.1 },
  cardboard:{ hardness: 0.2, noise: 0.2 },
  wood:     { hardness: 0.5, noise: 0.5 },
  hardware: { hardness: 0.9, noise: 0.7 },
};

const NODE_MODES = ['explore', 'sneak', 'quick', 'follow', 'hold', 'avoid'];
const NODE_GLYPHS = { explore: 'E', sneak: 'S', quick: 'Q', follow: 'F', hold: 'H', avoid: 'X' };
const NODE_DWELL = { explore: 2000, sneak: 1800, quick: 800, follow: 1200, hold: -1, avoid: 0 };

// ===== FLOOR PLANS =====
// Each floor: rooms (rect zones), doors (connections), entry point
const CABINETS = [
  { // Cabinet 1
    floors: [
      { // Floor 1
        rooms: [
          { x:0,y:0,w:5,h:4, label:'Filing A', tile:'paper' },
          { x:5,y:0,w:4,h:3, label:'Corridor', tile:'metal' },
          { x:9,y:0,w:3,h:5, label:'Filing B', tile:'cardboard' },
          { x:0,y:4,w:5,h:3, label:'Main Hall', tile:'wood' },
          { x:5,y:3,w:4,h:4, label:'Alcove', tile:'metal' },
          { x:0,y:7,w:8,h:3, label:'Basement Access', tile:'metal' },
          { x:8,y:5,w:4,h:5, label:'Storage', tile:'cardboard' },
        ],
        doors: [
          {r1:0,r2:1,col:5,row:1},{r1:1,r2:2,col:9,row:1},
          {r1:0,r2:3,col:2,row:4},{r1:1,r2:4,col:6,row:3},
          {r1:2,r2:4,col:9,row:4},{r1:3,r2:5,col:3,row:7},
          {r1:4,r2:5,col:6,row:7},{r1:4,r2:6,col:9,row:5},
          {r1:5,r2:6,col:8,row:8},
        ],
        entry: { col:4, row:9 },
        objectives: [{col:2,row:1},{col:10,row:2}],
        keyPos: {col:10,row:7},
      },
      { // Floor 2
        rooms: [
          { x:0,y:0,w:6,h:5, label:'Records', tile:'paper' },
          { x:6,y:0,w:6,h:3, label:'North Wing', tile:'wood' },
          { x:6,y:3,w:3,h:4, label:'Closet', tile:'cardboard' },
          { x:9,y:3,w:3,h:4, label:'Server Room', tile:'hardware' },
          { x:0,y:5,w:6,h:5, label:'Atrium', tile:'metal' },
          { x:6,y:7,w:6,h:3, label:'South Passage', tile:'metal' },
        ],
        doors: [
          {r1:0,r2:1,col:6,row:1},{r1:0,r2:4,col:3,row:5},
          {r1:1,r2:2,col:7,row:3},{r1:1,r2:3,col:10,row:3},
          {r1:2,r2:4,col:6,row:5},{r1:2,r2:5,col:7,row:7},
          {r1:3,r2:5,col:10,row:7},{r1:4,r2:5,col:6,row:8},
        ],
        entry: { col:3, row:9 },
        objectives: [{col:10,row:4},{col:2,row:2}],
        keyPos: {col:7,row:5},
      },
      { // Floor 3
        rooms: [
          { x:0,y:0,w:4,h:4, label:'Vault Ante', tile:'metal' },
          { x:4,y:0,w:4,h:4, label:'Executive', tile:'wood' },
          { x:8,y:0,w:4,h:4, label:'Archive', tile:'paper' },
          { x:0,y:4,w:6,h:3, label:'Gallery', tile:'hardware' },
          { x:6,y:4,w:6,h:3, label:'Transit', tile:'metal' },
          { x:0,y:7,w:12,h:3, label:'Grand Hall', tile:'cardboard' },
        ],
        doors: [
          {r1:0,r2:1,col:4,row:2},{r1:1,r2:2,col:8,row:2},
          {r1:0,r2:3,col:2,row:4},{r1:1,r2:3,col:5,row:4},
          {r1:2,r2:4,col:9,row:4},{r1:3,r2:5,col:3,row:7},
          {r1:4,r2:5,col:8,row:7},
        ],
        entry: { col:6, row:9 },
        objectives: [{col:1,row:1},{col:10,row:1}],
        keyPos: {col:6,row:5},
      },
    ],
  },
];

// ===== STATE =====
const S = {
  phase: 'briefing',
  floor: 0,
  cabinet: 0,
  paused: false,

  blueprint: {
    stickers: [],
    pins: [],
    revealed: new Set(),
    nodes: {},          // { roomIndex: 'explore'|'sneak'|'quick'|'follow'|'hold'|'avoid' }
    wormPath: [],       // ordered cell coords [{col,row},...] — selected worm route
    wormType: 'normal',
  },

  world: {
    tiles: [],       // [row][col] tile type string
    gnomes: [],
    gnomeTick: 0,
    gnomeTickInterval: 2800,
  },

  agents: {
    mouse: {
      col: 0, row: 0, x: 0, y: 0,
      targetCol: 0, targetRow: 0, moveT: 1,
      tickAccum: 0, tickInterval: 1800,
      queue: [], queueMax: 7,
      personality: { caution: 0.7, trust: 0.3, thoroughness: 0.9 },
      visited: new Set(), report: null, active: false,
    },
    worm: {
      col: 0, row: 0, x: 0, y: 0,
      targetCol: 0, targetRow: 0, moveT: 1,
      tickAccum: 0, tickInterval: 1300,  // slow, steady, never stops
      queue: [], queueMax: 3,
      trail: [],          // [{col, row, age}] — visual fade trail (recent movement)
      trailMax: 30,
      body: new Set(),    // cellKey strings — persistent body segments (infrastructure)
      bodyOrder: [],      // ordered list of body cell keys for drawing connections
      personality: { caution: 0.2, trust: 0.1, impulsiveness: 0.8 },
      visited: new Set(), report: null, active: false,
    },
  },

  ui: {
    drag: { active: false, type: null, x: 0, y: 0 },
    selectedSticker: null,
    holdStart: 0, holdTimer: null,
    dpr: 1, w: 0, h: 0,
    gridPx: 0, gridOx: 0, gridOy: 0,
    canvasRect: null,
    grainSeed: Math.random() * 1000,
  },

  run: {
    trust: 0,
    manifestSlots: { FILE: 1, KEY: 1, INTEL: 2 },
    pinsPlaced: { FILE: 0, KEY: 0, INTEL: 0 },
    floorsCleared: 0,
  },

  log: { agent: [], int: [] },

  briefing: {
    notes: [],          // sticky notes for this floor
    logQueue: [],       // sequential log lines to typewrite
    logIndex: 0,        // which line we're on
    logTimer: 0,        // ms accumulator for pacing
    elapsed: 0,         // total briefing time
    allResolved: false,  // true when every note has a choice
    mouseQueuePenalty: 0, // overrides against Mouse's preference
    notesAppearing: false, // true once log is done and notes start fading in
    noteAppearIndex: 0,    // which note is currently appearing
    noteAppearTimer: 0,    // timer for staggered appearance
    resolveDelay: 0,       // delay after all resolved before transition
    pendingEffects: [],    // effects to apply at execution start
  },

  planLoop: {
    active: false,
    t: 0,
    mouseCell: { col: 0, row: 0 },
    mouseRoomIdx: 0,
    mouseProgress: 0,       // 0-1 within current room dwell
    mousePath: [],           // cells mouse has traversed this iteration
    wormProgress: 0,         // 0-1 along wormPath
    wormCellIdx: 0,          // current index into wormPath
    paused: false,
    pauseRoom: -1,
    clean: false,
    cleanCount: 0,
    alpha: 0.5,              // drawing alpha — rises after first clean
    roomOrder: [],           // room visit order for Mouse (indices into floor.rooms)
    roomDoors: [],           // door cells connecting rooms in visit order
  },
};

// ===== PERSISTENCE =====
const SAVE_KEY = 'worm-and-mouse';
function save() {
  localStorage.setItem(`${SAVE_KEY}/trust`, JSON.stringify(S.run.trust));
}
function load() {
  const t = localStorage.getItem(`${SAVE_KEY}/trust`);
  if (t !== null) S.run.trust = JSON.parse(t);
}
load();

// ===== CANVAS SETUP =====
const canvas = document.getElementById('bp');
const ctx = canvas.getContext('2d');

function resize() {
  const wrap = document.getElementById('bp-wrap');
  const r = wrap.getBoundingClientRect();
  S.ui.dpr = window.devicePixelRatio || 1;
  S.ui.w = r.width;
  S.ui.h = r.height;
  canvas.width = r.width * S.ui.dpr;
  canvas.height = r.height * S.ui.dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(S.ui.dpr, 0, 0, S.ui.dpr, 0, 0);

  // Compute grid geometry
  const margin = 16;
  const availW = S.ui.w - margin * 2;
  const availH = S.ui.h - margin * 2;
  S.ui.gridPx = Math.floor(Math.min(availW / GRID.cols, availH / GRID.rows));
  S.ui.gridOx = Math.floor((S.ui.w - S.ui.gridPx * GRID.cols) / 2);
  S.ui.gridOy = Math.floor((S.ui.h - S.ui.gridPx * GRID.rows) / 2);
  S.ui.canvasRect = canvas.getBoundingClientRect();
}
window.addEventListener('resize', () => { resize(); });
resize();

// ===== HELPERS =====
function gridToCanvas(col, row) {
  return {
    x: S.ui.gridOx + col * S.ui.gridPx,
    y: S.ui.gridOy + row * S.ui.gridPx,
  };
}
function canvasToGrid(cx, cy) {
  const col = Math.floor((cx - S.ui.gridOx) / S.ui.gridPx);
  const row = Math.floor((cy - S.ui.gridOy) / S.ui.gridPx);
  if (col < 0 || col >= GRID.cols || row < 0 || row >= GRID.rows) return null;
  return { col, row };
}
function pointerToCanvas(e) {
  const r = S.ui.canvasRect || canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function currentFloor() {
  return CABINETS[S.cabinet].floors[S.floor];
}
function roomAt(col, row) {
  const fl = currentFloor();
  for (const rm of fl.rooms) {
    if (col >= rm.x && col < rm.x + rm.w && row >= rm.y && row < rm.y + rm.h) return rm;
  }
  return null;
}
function isDoor(col, row) {
  const fl = currentFloor();
  return fl.doors.some(d => d.col === col && d.row === row);
}
function isWalkable(col, row) {
  if (col < 0 || col >= GRID.cols || row < 0 || row >= GRID.rows) return false;
  return roomAt(col, row) !== null || isDoor(col, row);
}
function cellKey(col, row) { return col + ',' + row; }

// Seeded random for grain
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const grainRng = mulberry32(42);

// ===== WORLD GENERATION =====
function generateWorld() {
  const fl = currentFloor();
  S.world.tiles = [];
  for (let r = 0; r < GRID.rows; r++) {
    S.world.tiles[r] = [];
    for (let c = 0; c < GRID.cols; c++) {
      const rm = roomAt(c, r);
      if (rm) {
        // Dominant tile with 20% chance of variant
        if (Math.random() < 0.2) {
          const types = Object.keys(TILE_TYPES).filter(t => t !== rm.tile);
          S.world.tiles[r][c] = types[Math.floor(Math.random() * types.length)];
        } else {
          S.world.tiles[r][c] = rm.tile;
        }
      } else {
        S.world.tiles[r][c] = null;
      }
    }
  }

  // Spawn 2-3 gnomes at edges
  S.world.gnomes = [];
  const edges = ['top', 'bottom', 'left', 'right'];
  const gnomeCount = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < gnomeCount; i++) {
    const edge = edges[Math.floor(Math.random() * edges.length)];
    let gc, gr;
    if (edge === 'top')    { gc = Math.floor(Math.random() * GRID.cols); gr = 0; }
    if (edge === 'bottom') { gc = Math.floor(Math.random() * GRID.cols); gr = GRID.rows - 1; }
    if (edge === 'left')   { gc = 0; gr = Math.floor(Math.random() * GRID.rows); }
    if (edge === 'right')  { gc = GRID.cols - 1; gr = Math.floor(Math.random() * GRID.rows); }
    S.world.gnomes.push({
      col: gc, row: gr, presence: 0, edgeDir: edge,
      tickPhase: Math.random() * TAU, driftT: 0, alerted: false,
      trapping: null, trapTicks: 0,
      _bodyBumped: false, _onBody: false, _witnessed: false,
    });
  }
}

// ===== DRAWING =====
function drawBlueprint() {
  const w = S.ui.w, h = S.ui.h;
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;

  // Paper background
  ctx.fillStyle = '#e8e0cc';
  ctx.fillRect(0, 0, w, h);

  // Paper grain
  const rng = mulberry32(42);
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 600; i++) {
    const px = rng() * w, py = rng() * h;
    const s = rng() * 2 + 0.5;
    ctx.fillStyle = rng() > 0.5 ? '#8a7a60' : '#6a6a5a';
    ctx.fillRect(px, py, s, s);
  }
  ctx.globalAlpha = 1;

  // Grid lines (mimeograph: slight opacity variation)
  const lineRng = mulberry32(77);
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= GRID.cols; c++) {
    ctx.strokeStyle = `rgba(90,106,74,${0.08 + lineRng() * 0.06})`;
    ctx.beginPath();
    ctx.moveTo(gx + c * gp, gy);
    ctx.lineTo(gx + c * gp, gy + GRID.rows * gp);
    ctx.stroke();
  }
  for (let r = 0; r <= GRID.rows; r++) {
    ctx.strokeStyle = `rgba(90,106,74,${0.08 + lineRng() * 0.06})`;
    ctx.beginPath();
    ctx.moveTo(gx, gy + r * gp);
    ctx.lineTo(gx + GRID.cols * gp, gy + r * gp);
    ctx.stroke();
  }

  // Room fills (very faint zone indication)
  const fl = currentFloor();
  for (const rm of fl.rooms) {
    ctx.fillStyle = 'rgba(90,106,74,0.03)';
    ctx.fillRect(gx + rm.x * gp + 1, gy + rm.y * gp + 1, rm.w * gp - 2, rm.h * gp - 2);

    // Room label
    ctx.fillStyle = 'rgba(90,106,74,0.2)';
    ctx.font = `${Math.max(8, gp * 0.22)}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rm.label, gx + (rm.x + rm.w / 2) * gp, gy + (rm.y + rm.h / 2) * gp);
  }

  // Room outlines (thick ink, slight variation)
  const wallRng = mulberry32(33);
  ctx.strokeStyle = '#1a1a18';
  for (const rm of fl.rooms) {
    ctx.lineWidth = 1.5 + wallRng() * 0.8;
    ctx.strokeRect(gx + rm.x * gp, gy + rm.y * gp, rm.w * gp, rm.h * gp);
  }

  // Doors (gaps in walls)
  for (const d of fl.doors) {
    const dx = gx + d.col * gp;
    const dy = gy + d.row * gp;
    ctx.fillStyle = '#e8e0cc';
    // Determine door orientation by checking if it's on a horizontal or vertical wall
    const doorSize = gp * 0.6;
    const doorOffset = (gp - doorSize) / 2;
    // Clear a section of wall and draw door marks
    ctx.fillRect(dx + doorOffset, dy - 2, doorSize, 5);
    ctx.fillRect(dx - 2, dy + doorOffset, 5, doorSize);
    // Door tick marks
    ctx.strokeStyle = 'rgba(90,106,74,0.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(dx + doorOffset, dy - 1);
    ctx.lineTo(dx + doorOffset, dy + 2);
    ctx.moveTo(dx + doorOffset + doorSize, dy - 1);
    ctx.lineTo(dx + doorOffset + doorSize, dy + 2);
    ctx.moveTo(dx - 1, dy + doorOffset);
    ctx.lineTo(dx + 2, dy + doorOffset);
    ctx.moveTo(dx - 1, dy + doorOffset + doorSize);
    ctx.lineTo(dx + 2, dy + doorOffset + doorSize);
    ctx.stroke();
  }

  // Entry marker
  const en = fl.entry;
  ctx.fillStyle = 'rgba(90,106,74,0.3)';
  ctx.beginPath();
  const ecx = gx + (en.col + 0.5) * gp;
  const ecy = gy + (en.row + 0.5) * gp;
  ctx.moveTo(ecx, ecy - gp * 0.25);
  ctx.lineTo(ecx + gp * 0.2, ecy + gp * 0.15);
  ctx.lineTo(ecx - gp * 0.2, ecy + gp * 0.15);
  ctx.fill();
  ctx.font = `${Math.max(7, gp * 0.18)}px 'Courier New', monospace`;
  ctx.fillStyle = 'rgba(90,106,74,0.4)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('ENTRY', ecx, ecy + gp * 0.2);

  // Room nodes (planning phase)
  if (S.phase === 'planning') {
    for (let ri = 0; ri < fl.rooms.length; ri++) {
      const rm = fl.rooms[ri];
      const ncx = gx + (rm.x + rm.w / 2) * gp;
      const ncy = gy + (rm.y + rm.h / 2) * gp + gp * 0.45;
      const mode = S.blueprint.nodes[ri];
      const glyph = mode ? NODE_GLYPHS[mode] : '?';

      // Circle background
      ctx.fillStyle = mode ? 'rgba(90,106,74,0.15)' : 'rgba(26,26,24,0.06)';
      ctx.beginPath();
      ctx.arc(ncx, ncy, gp * 0.32, 0, TAU);
      ctx.fill();

      // Circle border
      ctx.strokeStyle = mode ? 'rgba(90,106,74,0.5)' : 'rgba(26,26,24,0.15)';
      ctx.lineWidth = mode ? 1.2 : 0.8;
      ctx.beginPath();
      ctx.arc(ncx, ncy, gp * 0.32, 0, TAU);
      ctx.stroke();

      // Glyph
      ctx.fillStyle = mode ? '#5a6a4a' : 'rgba(26,26,24,0.25)';
      ctx.font = `bold ${Math.max(9, gp * 0.28)}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(glyph, ncx, ncy);
    }
  }

  // Worm path (planning phase)
  if (S.phase === 'planning' && S.blueprint.wormPath.length > 1) {
    // Ghost worm (faint reference)
    // Normal worm path
    ctx.save();
    ctx.strokeStyle = 'rgba(138,90,58,0.3)';
    ctx.lineWidth = gp * 0.08;
    ctx.setLineDash([3, 4]);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    const wp0 = S.blueprint.wormPath[0];
    ctx.moveTo(gx + (wp0.col + 0.5) * gp, gy + (wp0.row + 0.5) * gp);
    for (let i = 1; i < S.blueprint.wormPath.length; i++) {
      const wp = S.blueprint.wormPath[i];
      const prev = S.blueprint.wormPath[i - 1];
      // Rectilinear: go horizontal first, then vertical
      ctx.lineTo(gx + (wp.col + 0.5) * gp, gy + (prev.row + 0.5) * gp);
      ctx.lineTo(gx + (wp.col + 0.5) * gp, gy + (wp.row + 0.5) * gp);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Revealed tiles
  for (const key of S.blueprint.revealed) {
    const [c, r] = key.split(',').map(Number);
    const tile = S.world.tiles[r] && S.world.tiles[r][c];
    if (!tile) continue;
    drawTilePattern(c, r, tile);
  }

  // Placed stickers
  for (const st of S.blueprint.stickers) {
    drawSticker(st);
  }

  // Placed pins
  for (const pin of S.blueprint.pins) {
    drawPin(pin);
  }
}

function drawTilePattern(col, row, tile) {
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  const x = gx + col * gp, y = gy + row * gp;
  const pad = 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x + pad, y + pad, gp - pad * 2, gp - pad * 2);
  ctx.clip();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#3a4a2a';
  ctx.lineWidth = 0.5;

  if (tile === 'metal') {
    // Diagonal hatching
    for (let i = -gp; i < gp * 2; i += 4) {
      ctx.beginPath();
      ctx.moveTo(x + i, y);
      ctx.lineTo(x + i + gp, y + gp);
      ctx.stroke();
    }
  } else if (tile === 'paper') {
    // Horizontal fine lines
    for (let i = 3; i < gp; i += 3) {
      ctx.beginPath();
      ctx.moveTo(x + pad, y + i);
      ctx.lineTo(x + gp - pad, y + i);
      ctx.stroke();
    }
  } else if (tile === 'cardboard') {
    // Crosshatch
    for (let i = -gp; i < gp * 2; i += 5) {
      ctx.beginPath();
      ctx.moveTo(x + i, y); ctx.lineTo(x + i + gp, y + gp);
      ctx.moveTo(x + i + gp, y); ctx.lineTo(x + i, y + gp);
      ctx.stroke();
    }
  } else if (tile === 'wood') {
    // Curved grain
    for (let i = 3; i < gp; i += 4) {
      ctx.beginPath();
      ctx.moveTo(x + pad, y + i);
      ctx.quadraticCurveTo(x + gp / 2, y + i + 2, x + gp - pad, y + i);
      ctx.stroke();
    }
  } else if (tile === 'hardware') {
    // Dot grid
    for (let i = 3; i < gp; i += 4) {
      for (let j = 3; j < gp; j += 4) {
        ctx.fillStyle = '#3a4a2a';
        ctx.fillRect(x + i, y + j, 1, 1);
      }
    }
  }

  ctx.restore();
}

function drawSticker(st) {
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  const def = STICKER_TYPES[st.type];
  if (!def) return;
  const cx = gx + (st.col + 0.5) * gp;
  const cy = gy + (st.row + 0.5) * gp;

  // Developing animation (gnomaction cost visual)
  let alpha = st.resolved ? 0.85 : Math.min(0.85, st.gnomactionT / 800);

  // Confidence ring
  ctx.globalAlpha = alpha * 0.3;
  ctx.strokeStyle = def.color;
  ctx.lineWidth = st.confidence === 'held' ? 2.5 : 1;
  if (st.confidence === 'held') {
    ctx.beginPath();
    ctx.arc(cx, cy, gp * 0.35, 0, TAU);
    ctx.stroke();
  } else {
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(cx, cy, gp * 0.35, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Emoji
  ctx.globalAlpha = alpha;
  ctx.font = `${gp * 0.45}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.emoji, cx, cy);
  ctx.globalAlpha = 1;
}

function drawPin(pin) {
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  const def = PIN_DEFS[pin.type];
  if (!def) return;
  const cx = gx + (pin.col + 0.5) * gp;
  const cy = gy + (pin.row + 0.5) * gp;

  // Pin dot
  ctx.fillStyle = '#b04030';
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(cx, cy - gp * 0.1, 3, 0, TAU);
  ctx.fill();

  // Pin emoji
  ctx.globalAlpha = 0.8;
  ctx.font = `${gp * 0.3}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.emoji, cx, cy + gp * 0.1);
  ctx.globalAlpha = 1;
}

// ===== LIVE SIGNAL (agents + gnomes) =====
function drawLiveSignal() {
  if (S.phase !== 'execution') return;
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  const mouse = S.agents.mouse;
  const worm = S.agents.worm;

  // Worm persistent body (infrastructure)
  if (worm.bodyOrder.length > 1) {
    // Draw body connections as steady lines
    ctx.strokeStyle = 'rgba(138,90,58,0.25)';
    ctx.lineWidth = gp * 0.12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    const b0 = worm.bodyOrder[0].split(',').map(Number);
    ctx.moveTo(gx + (b0[0] + 0.5) * gp, gy + (b0[1] + 0.5) * gp);
    for (let i = 1; i < worm.bodyOrder.length; i++) {
      const b = worm.bodyOrder[i].split(',').map(Number);
      ctx.lineTo(gx + (b[0] + 0.5) * gp, gy + (b[1] + 0.5) * gp);
    }
    ctx.stroke();

    // Draw body segment dots (tripwire nodes)
    for (const key of worm.body) {
      const [c, r] = key.split(',').map(Number);
      const cx = gx + (c + 0.5) * gp;
      const cy = gy + (r + 0.5) * gp;
      // Tripwire active indicator
      ctx.fillStyle = 'rgba(138,90,58,0.2)';
      ctx.beginPath();
      ctx.arc(cx, cy, gp * 0.08, 0, TAU);
      ctx.fill();
      // Small cross mark for tripwire
      ctx.strokeStyle = 'rgba(138,90,58,0.3)';
      ctx.lineWidth = 0.8;
      const s = gp * 0.06;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy + s);
      ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy + s);
      ctx.stroke();
    }
  }

  // Worm recent movement trail (fading, shows direction of travel)
  if (worm.trail.length > 1) {
    for (let i = 1; i < worm.trail.length; i++) {
      const t0 = worm.trail[i - 1], t1 = worm.trail[i];
      const age0 = Math.min(1, t0.age / 3000);
      const age1 = Math.min(1, t1.age / 3000);
      const alpha = 1 - (age0 + age1) / 2;
      const width = gp * 0.14 * (1 - (age0 + age1) / 2) + 1;
      if (alpha <= 0) continue;
      ctx.strokeStyle = `rgba(138,90,58,${alpha * 0.5})`;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(gx + (t0.col + 0.5) * gp, gy + (t0.row + 0.5) * gp);
      ctx.lineTo(gx + (t1.col + 0.5) * gp, gy + (t1.row + 0.5) * gp);
      ctx.stroke();
    }
  }

  // Worm head (larger than before — the front of a growing body)
  if (worm.active) {
    ctx.fillStyle = '#8a5a3a';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(worm.x, worm.y, gp * 0.16, 0, TAU);
    ctx.fill();
    // Inner dot
    ctx.fillStyle = '#6a3a1a';
    ctx.beginPath();
    ctx.arc(worm.x, worm.y, gp * 0.06, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Mouse blip
  if (mouse.active) {
    ctx.fillStyle = '#4a6a8a';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, gp * 0.12, 0, TAU);
    ctx.fill();

    // Trapped indicator
    if (mouse._trapped) {
      ctx.strokeStyle = 'rgba(180,80,40,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, gp * 0.2, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // Pulse ring on recent queue change
    if (mouse._pulseT && mouse._pulseT > 0) {
      const pr = gp * 0.3 * (1 - mouse._pulseT / 600);
      ctx.strokeStyle = `rgba(74,106,138,${mouse._pulseT / 600 * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, pr, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Gnome edge disturbances
  for (const g of S.world.gnomes) {
    drawGnomeDisturbance(g);
  }
}

function drawGnomeDisturbance(g) {
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  if (g.presence <= 0) return;
  const cx = gx + (g.col + 0.5) * gp;
  const cy = gy + (g.row + 0.5) * gp;

  if (g.presence < 0.5) {
    // Edge disturbance: smear/static
    ctx.globalAlpha = g.presence * 0.5;
    const rng = mulberry32(Math.floor(g.col * 13 + g.row * 7 + g.driftT));
    for (let i = 0; i < 6; i++) {
      const ox = (rng() - 0.5) * gp * 0.6;
      const oy = (rng() - 0.5) * gp * 0.6;
      ctx.fillStyle = `rgba(90,106,74,${0.3 + rng() * 0.3})`;
      ctx.fillRect(cx + ox, cy + oy, rng() * 3 + 1, rng() * 2 + 0.5);
    }
    ctx.globalAlpha = 1;
  } else {
    // Resolved gnome glyph
    ctx.globalAlpha = Math.min(1, (g.presence - 0.5) * 2) * 0.6;
    const wobble = Math.sin(g.tickPhase) * 1.5;
    ctx.font = `${gp * 0.35}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u{1F9CC}', cx + wobble, cy);

    // Conversation indicator
    if (g.trapping) {
      ctx.globalAlpha = 0.5;
      ctx.font = `${gp * 0.18}px 'Courier New', monospace`;
      ctx.fillStyle = 'var(--ink)';
      // Speech dots that animate
      const dots = '.'.repeat(1 + Math.floor(g.tickPhase * 2) % 3);
      ctx.fillText(dots, cx + gp * 0.25, cy - gp * 0.25);
    }
    ctx.globalAlpha = 1;
  }
}

// ===== STICKER PALETTE =====
function buildPalette() {
  const pal = document.getElementById('sticker-palette');
  pal.innerHTML = '';
  for (const [key, def] of Object.entries(STICKER_TYPES)) {
    const btn = document.createElement('button');
    btn.className = 'sticker-btn';
    btn.dataset.type = key;
    btn.innerHTML = `<span>${def.emoji}</span><span class="sticker-label">${def.label}</span>`;
    btn.addEventListener('pointerdown', onPaletteDown);
    pal.appendChild(btn);
  }
}

function onPaletteDown(e) {
  e.preventDefault();
  const type = e.currentTarget.dataset.type;
  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  if (isMobile) {
    // Mobile: tap-to-select
    if (S.ui.selectedSticker === type) {
      S.ui.selectedSticker = null;
      document.querySelectorAll('.sticker-btn').forEach(b => b.classList.remove('selected'));
    } else {
      S.ui.selectedSticker = type;
      document.querySelectorAll('.sticker-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.type === type);
      });
    }
    return;
  }

  // Desktop: drag
  S.ui.drag = { active: true, type, x: e.clientX, y: e.clientY };
  S.ui.holdStart = performance.now();
  const ghost = document.getElementById('drag-ghost');
  ghost.textContent = STICKER_TYPES[type].emoji;
  ghost.style.display = 'block';
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';

  const onMove = (ev) => {
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top = ev.clientY + 'px';
    S.ui.drag.x = ev.clientX;
    S.ui.drag.y = ev.clientY;
  };
  const onUp = (ev) => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    ghost.style.display = 'none';

    const holdDuration = performance.now() - S.ui.holdStart;
    const confidence = holdDuration > 300 ? 'held' : 'quick';

    const pt = pointerToCanvas(ev);
    const cell = canvasToGrid(pt.x, pt.y);
    if (cell && roomAt(cell.col, cell.row)) {
      placeSticker(S.ui.drag.type, cell.col, cell.row, confidence);
    }
    S.ui.drag.active = false;
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// Canvas click for mobile placement
canvas.addEventListener('pointerdown', (e) => {
  if (S.ui.drag.active) return;
  S.ui.holdStart = performance.now();
});
canvas.addEventListener('pointerup', (e) => {
  if (S.ui.drag.active) return;
  const pt = pointerToCanvas(e);

  // Briefing phase: tap sticky notes
  if (S.phase === 'briefing') {
    for (const note of S.briefing.notes) {
      if (note.resolved) continue;
      if (note.appearT < 0.8) continue;
      const b = note._bounds;
      if (!b) continue;
      if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
        // Left half = A, right half = B
        const midX = b.x + b.w / 2;
        note.choice = pt.x < midX ? 'A' : 'B';
        note.resolved = true;

        // Mouse queue penalty for overriding her preference
        if (note.mousePrefers && note.choice !== note.mousePrefers) {
          S.briefing.mouseQueuePenalty++;
        }

        logInt(`// ${note.roomLabel}: ${note.choice === 'A' ? note.optionA.shortLabel : note.optionB.shortLabel}`);
        break;
      }
    }
    return;
  }

  const cell = canvasToGrid(pt.x, pt.y);
  if (!cell) return;

  // Room node tap (planning phase) — check if tap is near a room center node
  if (S.phase === 'planning') {
    const fl = currentFloor();
    const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
    for (let ri = 0; ri < fl.rooms.length; ri++) {
      const rm = fl.rooms[ri];
      const ncx = gx + (rm.x + rm.w / 2) * gp;
      const ncy = gy + (rm.y + rm.h / 2) * gp + gp * 0.45;
      const dx = pt.x - ncx, dy = pt.y - ncy;
      if (Math.sqrt(dx * dx + dy * dy) < gp * 0.6) {
        const cur = S.blueprint.nodes[ri];
        const idx = cur ? NODE_MODES.indexOf(cur) : -1;
        const next = NODE_MODES[(idx + 1) % NODE_MODES.length];
        S.blueprint.nodes[ri] = next;
        // Reset plan loop on any node change
        resetPlanLoop();
        return;
      }
    }
  }

  // Mobile sticker placement
  if (S.ui.selectedSticker && S.phase === 'planning') {
    const holdDuration = performance.now() - S.ui.holdStart;
    const confidence = holdDuration > 300 ? 'held' : 'quick';
    if (roomAt(cell.col, cell.row)) {
      placeSticker(S.ui.selectedSticker, cell.col, cell.row, confidence);
      S.ui.selectedSticker = null;
      document.querySelectorAll('.sticker-btn').forEach(b => b.classList.remove('selected'));
    }
    return;
  }

  // Mobile pin placement
  if (S.ui.selectedPin && S.phase === 'planning') {
    if (roomAt(cell.col, cell.row)) {
      placePin(S.ui.selectedPin, cell.col, cell.row);
      S.ui.selectedPin = null;
      buildManifest();
    }
    return;
  }

  // Tap existing sticker to remove (planning only)
  if (S.phase === 'planning') {
    const idx = S.blueprint.stickers.findIndex(st =>
      st.col === cell.col && st.row === cell.row
    );
    if (idx >= 0) {
      S.blueprint.stickers.splice(idx, 1);
      return;
    }
    // Tap existing pin to pick it up
    const pidx = S.blueprint.pins.findIndex(p =>
      p.col === cell.col && p.row === cell.row
    );
    if (pidx >= 0) {
      const pin = S.blueprint.pins.splice(pidx, 1)[0];
      S.run.pinsPlaced[pin.type]--;
      buildManifest();
      return;
    }
  }

  // Execution phase: tap chip interaction handled elsewhere
});

function placeSticker(type, col, row, confidence) {
  // Remove existing sticker at same position
  S.blueprint.stickers = S.blueprint.stickers.filter(st =>
    !(st.col === col && st.row === row)
  );
  S.blueprint.stickers.push({
    type, col, row, confidence,
    gnomactionT: 0,
    resolved: S.phase === 'planning', // instant during planning, delayed during active
  });

  // Gnomaction: during active phase, gnome tick fires before sticker resolves
  if (S.phase === 'execution') {
    gnomeTick();
    logInt(`STICKER PLACED: ${STICKER_TYPES[type].label} @ (${col},${row}) ${confidence === 'held' ? '[CONFIDENT]' : '[approximate]'}`);
  }

  // Reset plan loop on any blueprint change
  if (S.phase === 'planning') resetPlanLoop();
}

function placePin(type, col, row) {
  S.blueprint.pins.push({ type, col, row, id: Date.now() });
  S.run.pinsPlaced[type]++;
}

// ===== WORM PATH GENERATION =====
// ===== ROOM GRAPH UTILITIES =====
function buildRoomAdj() {
  const fl = currentFloor();
  const adj = fl.rooms.map(() => []);
  for (const d of fl.doors) {
    adj[d.r1].push({ room: d.r2, doorCol: d.col, doorRow: d.row });
    adj[d.r2].push({ room: d.r1, doorCol: d.col, doorRow: d.row });
  }
  return adj;
}

function entryRoomIndex() {
  const fl = currentFloor();
  const e = fl.entry;
  return fl.rooms.findIndex(r =>
    e.col >= r.x && e.col < r.x + r.w && e.row >= r.y && e.row < r.y + r.h
  );
}

function roomCenter(ri) {
  const rm = currentFloor().rooms[ri];
  return { col: rm.x + Math.floor(rm.w / 2), row: rm.y + Math.floor(rm.h / 2) };
}

// DFS contiguous walk: visits every room exactly once, each transition
// goes through a real door so the path never cuts through walls.
// Returns [{roomIdx, doorCol, doorRow}] in walk order.
function dfsRoomWalk(adj, startRi, entry) {
  const fl = currentFloor();
  const visited = new Set();
  const walk = [];

  function dfs(ri, doorCol, doorRow) {
    visited.add(ri);
    walk.push({ roomIdx: ri, doorCol, doorRow });
    // Sort neighbors: prefer objective rooms, then larger rooms
    const nbrs = adj[ri]
      .filter(n => !visited.has(n.room))
      .sort((a, b) => {
        const ra = fl.rooms[a.room], rb = fl.rooms[b.room];
        const aObj = fl.objectives.some(o => o.col >= ra.x && o.col < ra.x + ra.w && o.row >= ra.y && o.row < ra.y + ra.h) ? 1 : 0;
        const bObj = fl.objectives.some(o => o.col >= rb.x && o.col < rb.x + rb.w && o.row >= rb.y && o.row < rb.y + rb.h) ? 1 : 0;
        if (aObj !== bObj) return bObj - aObj;
        return (rb.w * rb.h) - (ra.w * ra.h);
      });
    for (const n of nbrs) {
      // Re-check: earlier recursive calls may have visited this room
      if (!visited.has(n.room)) {
        dfs(n.room, n.doorCol, n.doorRow);
      }
    }
  }

  const eri = startRi >= 0 ? startRi : 0;
  dfs(eri, entry.col, entry.row);
  return walk;
}

// Build a waypoint path from a room walk.
// Path goes: entry → (center of room 0) → door → (center of room 1) → door → ...
// Every segment stays within room geometry because center and door are both inside the room.
function walkToPath(walk, entry) {
  const path = [];
  path.push({ col: entry.col, row: entry.row });

  for (let i = 0; i < walk.length; i++) {
    const step = walk[i];
    const c = roomCenter(step.roomIdx);
    if (i === 0) {
      // First room: entry → center (both inside entry room)
      if (c.col !== entry.col || c.row !== entry.row) {
        path.push(c);
      }
    } else {
      // Subsequent rooms: prev center → door → this center
      // The door is at the boundary between prev room and this room.
      const last = path[path.length - 1];
      if (step.doorCol !== last.col || step.doorRow !== last.row) {
        path.push({ col: step.doorCol, row: step.doorRow });
      }
      if (c.col !== step.doorCol || c.row !== step.doorRow) {
        path.push(c);
      }
    }
  }
  return path;
}

function generateWormPath() {
  const fl = currentFloor();
  const adj = buildRoomAdj();
  const eri = entryRoomIndex();
  const walk = dfsRoomWalk(adj, eri, fl.entry);
  S.blueprint.wormPath = walkToPath(walk, fl.entry);
  return walk;
}

// ===== MOUSE ROUTE GENERATION (for planning loop) =====
function generateMouseRoute() {
  const fl = currentFloor();
  const adj = buildRoomAdj();
  const eri = entryRoomIndex();
  const walk = dfsRoomWalk(adj, eri, fl.entry);

  // Tag each step with the dispatcher's node mode
  const order = walk.map(step => ({
    ...step,
    mode: S.blueprint.nodes[step.roomIdx] || null,
  }));

  // Build waypoint route (same geometry as worm, but with mode tags)
  const route = [];
  const entry = fl.entry;
  route.push({ col: entry.col, row: entry.row, roomIdx: walk[0].roomIdx, mode: order[0].mode });

  for (let i = 0; i < order.length; i++) {
    const step = order[i];
    if (step.mode === 'avoid') continue;
    const c = roomCenter(step.roomIdx);
    if (i === 0) {
      if (c.col !== entry.col || c.row !== entry.row) {
        route.push({ col: c.col, row: c.row, roomIdx: step.roomIdx, mode: step.mode });
      }
    } else {
      const last = route[route.length - 1];
      if (step.doorCol !== last.col || step.doorRow !== last.row) {
        route.push({ col: step.doorCol, row: step.doorRow, roomIdx: step.roomIdx, mode: step.mode });
      }
      if (c.col !== step.doorCol || c.row !== step.doorRow) {
        route.push({ col: c.col, row: c.row, roomIdx: step.roomIdx, mode: step.mode });
      }
    }
  }

  return { order, route };
}

// ===== PLANNING LOOP =====
function resetPlanLoop() {
  const lp = S.planLoop;
  lp.active = false;
  lp.t = 0;
  lp.mouseRoomIdx = 0;
  lp.mouseProgress = 0;
  lp.mousePath = [];
  lp.wormProgress = 0;
  lp.wormCellIdx = 0;
  lp.paused = false;
  lp.pauseRoom = -1;
  lp.clean = false;
  lp.cleanCount = 0;
  lp.alpha = 0.5;
  lp.roomOrder = [];
  lp._mouseRoute = [];
  lp._mouseRouteIdx = 0;
}

function canStartPlanLoop() {
  // Need at least one node set and a worm path
  const hasNode = Object.keys(S.blueprint.nodes).length > 0;
  const hasPath = S.blueprint.wormPath.length > 1;
  return hasNode && hasPath;
}

function startPlanLoopIteration() {
  const lp = S.planLoop;
  const fl = currentFloor();
  const entry = fl.entry;

  // Generate mouse route from current nodes
  const { order, route } = generateMouseRoute();
  lp.roomOrder = order;
  lp._mouseRoute = route;
  lp._mouseRouteIdx = 0;

  lp.active = true;
  lp.t = 0;
  lp.mouseCell = { col: entry.col, row: entry.row };
  lp.mouseRoomIdx = 0;
  lp.mouseProgress = 0;
  lp.mousePath = [{ col: entry.col, row: entry.row }];
  lp.wormProgress = 0;
  lp.wormCellIdx = 0;
  lp.paused = false;
  lp.pauseRoom = -1;
  lp.clean = false;
}

function updatePlanLoop(dt) {
  if (S.phase !== 'planning') return;

  const lp = S.planLoop;

  // Auto-start when conditions met
  if (!lp.active && canStartPlanLoop()) {
    startPlanLoopIteration();
    return;
  }

  if (!lp.active || lp.paused) return;

  lp.t += dt;

  // Advance worm along waypoints
  const wormSpeed = 800; // ms per waypoint
  const wormTarget = lp.t / wormSpeed;
  const prevWormIdx = lp.wormCellIdx;
  if (wormTarget > lp.wormCellIdx && lp.wormCellIdx < S.blueprint.wormPath.length - 1) {
    lp.wormCellIdx = Math.min(Math.floor(wormTarget), S.blueprint.wormPath.length - 1);
    lp.wormProgress = lp.wormCellIdx / Math.max(1, S.blueprint.wormPath.length - 1);
  }
  // Fractional progress within current waypoint segment for smooth interpolation
  lp._wormFrac = wormTarget - Math.floor(wormTarget);

  // Advance mouse along route waypoints
  const route = lp._mouseRoute;
  if (!route || route.length === 0) {
    completePlanLoop();
    return;
  }

  // Mouse speed varies by room node mode (ms per waypoint transition)
  const curRouteStep = route[Math.min(lp._mouseRouteIdx, route.length - 1)];
  let mouseSpeed = 600; // ms per waypoint default
  if (curRouteStep) {
    const mode = curRouteStep.mode;
    if (mode === 'explore') mouseSpeed = 900;
    else if (mode === 'sneak') mouseSpeed = 850;
    else if (mode === 'quick') mouseSpeed = 400;
    else if (mode === 'follow') mouseSpeed = 650;
    else if (mode === 'hold') {
      // Check if worm has reached this room yet
      const wormCell = S.blueprint.wormPath[lp.wormCellIdx];
      const rm = currentFloor().rooms[curRouteStep.roomIdx];
      if (rm && wormCell) {
        const wormInRoom = wormCell.col >= rm.x && wormCell.col < rm.x + rm.w &&
                           wormCell.row >= rm.y && wormCell.row < rm.y + rm.h;
        if (!wormInRoom) return; // hold — don't advance until worm arrives
      }
    }
    // No mode set — check if we should pause
    if (!mode && mode !== null) mouseSpeed = 600;
  }

  lp.mouseProgress += dt / mouseSpeed;
  // Store fractional progress for smooth drawing
  lp._mouseFrac = lp.mouseProgress;

  if (lp.mouseProgress >= 1 && lp._mouseRouteIdx < route.length - 1) {
    lp.mouseProgress -= 1;
    lp._mouseRouteIdx++;

    const step = route[lp._mouseRouteIdx];
    lp.mouseCell = { col: step.col, row: step.row };
    lp.mousePath.push({ col: step.col, row: step.row });

    // Check for room transition — does this room have a mode set?
    if (step.roomIdx !== undefined) {
      const mode = S.blueprint.nodes[step.roomIdx];
      if (!mode) {
        lp.paused = true;
        lp.pauseRoom = step.roomIdx;
        return;
      }
      // Check follow-worm conflict: worm finished path but never reached this room
      if (mode === 'follow' && lp.wormCellIdx >= S.blueprint.wormPath.length - 1) {
        const wormCell = S.blueprint.wormPath[lp.wormCellIdx];
        const rm = currentFloor().rooms[step.roomIdx];
        if (rm && wormCell) {
          const wormInRoom = wormCell.col >= rm.x && wormCell.col < rm.x + rm.w &&
                             wormCell.row >= rm.y && wormCell.row < rm.y + rm.h;
          if (!wormInRoom) {
            lp.paused = true;
            lp.pauseRoom = step.roomIdx;
            return;
          }
        }
      }
    }
  }

  // Check completion
  if (lp._mouseRouteIdx >= route.length - 1 && lp.mouseProgress >= 1) {
    completePlanLoop();
  }
}

function completePlanLoop() {
  const lp = S.planLoop;
  lp.clean = true;
  lp.cleanCount++;

  if (lp.cleanCount >= 2) {
    // THE SEND — transition to execution
    transitionToExecution();
    return;
  }

  // First clean: alpha bump, restart
  lp.alpha = 0.7;
  // Small pause then restart
  setTimeout(() => {
    if (S.phase === 'planning' && lp.cleanCount >= 1) {
      startPlanLoopIteration();
    }
  }, 600);
  lp.active = false; // pause briefly during restart delay
}

function transitionToExecution() {
  const lp = S.planLoop;
  const fl = currentFloor();

  // Apply briefing effects
  for (const effect of S.briefing.pendingEffects) {
    applyBriefingEffect(effect);
  }

  // Set mouse position from loop's current state
  const mouse = S.agents.mouse;
  const mouseCell = lp.mouseCell;
  mouse.col = mouseCell.col;
  mouse.row = mouseCell.row;
  mouse.targetCol = mouseCell.col;
  mouse.targetRow = mouseCell.row;
  mouse.moveT = 1;
  const mpos = gridToCanvas(mouseCell.col + 0.5, mouseCell.row + 0.5);
  mouse.x = mpos.x;
  mouse.y = mpos.y;
  mouse.active = true;
  mouse.visited = new Set(lp.mousePath.map(p => cellKey(p.col, p.row)));
  mouse.queue = [];
  mouse.tickAccum = 0;
  agentThink(mouse, 'mouse');

  // Set worm position from loop's current state
  const worm = S.agents.worm;
  const wormCell = S.blueprint.wormPath[lp.wormCellIdx] || fl.entry;
  worm.col = wormCell.col;
  worm.row = wormCell.row;
  worm.targetCol = wormCell.col;
  worm.targetRow = wormCell.row;
  worm.moveT = 1;
  const wpos = gridToCanvas(wormCell.col + 0.5, wormCell.row + 0.5);
  worm.x = wpos.x;
  worm.y = wpos.y;
  worm.active = true;
  // Worm body from path traversed so far
  worm.body = new Set();
  worm.bodyOrder = [];
  for (let i = 0; i <= lp.wormCellIdx; i++) {
    const wp = S.blueprint.wormPath[i];
    const key = cellKey(wp.col, wp.row);
    if (!worm.body.has(key)) {
      worm.body.add(key);
      worm.bodyOrder.push(key);
    }
  }
  worm.trail = [];
  worm.visited = new Set(worm.bodyOrder);
  worm.queue = [];
  worm.tickAccum = 0;
  agentThink(worm, 'worm');

  // Resolve all planning-phase stickers
  for (const st of S.blueprint.stickers) {
    st.resolved = true;
  }

  // Phase flip — no announcement
  S.phase = 'execution';
  S.planLoop.active = false;

  // UI: dim sticker palette
  document.getElementById('sticker-palette').style.opacity = '0.4';
  document.getElementById('sticker-palette').style.pointerEvents = 'none';

  // No log clearing, no "AGENTS DEPLOYED" message.
  // The dispatcher discovers they're in execution when the world moves.
  renderQueues();
}

function drawPlanLoop() {
  if (!S.planLoop.active && !S.planLoop.paused) return;
  const lp = S.planLoop;
  const gx = S.ui.gridOx, gy = S.ui.gridOy, gp = S.ui.gridPx;
  const alpha = lp.alpha;

  // Draw mouse path so far (thin dashed trail, rectilinear)
  if (lp.mousePath.length > 1) {
    ctx.save();
    ctx.strokeStyle = `rgba(74,106,138,${alpha * 0.5})`;
    ctx.lineWidth = gp * 0.06;
    ctx.setLineDash([2, 3]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gx + (lp.mousePath[0].col + 0.5) * gp, gy + (lp.mousePath[0].row + 0.5) * gp);
    for (let i = 1; i < lp.mousePath.length; i++) {
      const p = lp.mousePath[i], prev = lp.mousePath[i - 1];
      // Rectilinear: horizontal then vertical
      ctx.lineTo(gx + (p.col + 0.5) * gp, gy + (prev.row + 0.5) * gp);
      ctx.lineTo(gx + (p.col + 0.5) * gp, gy + (p.row + 0.5) * gp);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Draw worm progress along path (filled portion, rectilinear)
  if (S.blueprint.wormPath.length > 1 && lp.wormCellIdx > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(138,90,58,${alpha * 0.6})`;
    ctx.lineWidth = gp * 0.1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    const wp0 = S.blueprint.wormPath[0];
    ctx.moveTo(gx + (wp0.col + 0.5) * gp, gy + (wp0.row + 0.5) * gp);
    for (let i = 1; i <= lp.wormCellIdx; i++) {
      const wp = S.blueprint.wormPath[i], prev = S.blueprint.wormPath[i - 1];
      ctx.lineTo(gx + (wp.col + 0.5) * gp, gy + (prev.row + 0.5) * gp);
      ctx.lineTo(gx + (wp.col + 0.5) * gp, gy + (wp.row + 0.5) * gp);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Draw worm head (loop sim) — interpolate rectilinearly between waypoints
  const wp = S.blueprint.wormPath;
  if (wp.length > 0) {
    const wi = lp.wormCellIdx;
    const wf = lp._wormFrac || 0;
    const wCur = wp[wi];
    const wNext = wp[Math.min(wi + 1, wp.length - 1)];
    // Rectilinear interpolation: horizontal first half, vertical second half
    const wfx = Math.min(wf * 2, 1); // 0→1 during first half
    const wfy = Math.max((wf - 0.5) * 2, 0); // 0→1 during second half
    const wx = gx + (wCur.col + (wNext.col - wCur.col) * wfx + 0.5) * gp;
    const wy = gy + (wCur.row + (wNext.row - wCur.row) * wfy + 0.5) * gp;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#8a5a3a';
    ctx.beginPath();
    ctx.arc(wx, wy, gp * 0.12, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Draw mouse blip (loop sim) — interpolate rectilinearly between waypoints
  const mr = lp._mouseRoute;
  if (mr && mr.length > 0) {
    const mi = Math.min(lp._mouseRouteIdx, mr.length - 1);
    const mf = Math.min(lp._mouseFrac || 0, 1);
    const mCur = mr[mi];
    const mNext = mr[Math.min(mi + 1, mr.length - 1)];
    const mfx = Math.min(mf * 2, 1);
    const mfy = Math.max((mf - 0.5) * 2, 0);
    const mx = gx + (mCur.col + (mNext.col - mCur.col) * mfx + 0.5) * gp;
    const my = gy + (mCur.row + (mNext.row - mCur.row) * mfy + 0.5) * gp;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#4a6a8a';
    ctx.beginPath();
    ctx.arc(mx, my, gp * 0.1, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Pause indicator — pulsing ring at conflict room
  if (lp.paused && lp.pauseRoom >= 0) {
    const fl = currentFloor();
    const rm = fl.rooms[lp.pauseRoom];
    if (rm) {
      const pcx = gx + (rm.x + rm.w / 2) * gp;
      const pcy = gy + (rm.y + rm.h / 2) * gp;
      const pulse = 0.4 + Math.sin(performance.now() / 300) * 0.3;
      ctx.strokeStyle = `rgba(176,64,48,${pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(pcx, pcy, gp * 0.8, 0, TAU);
      ctx.stroke();

      // "?" indicator
      ctx.fillStyle = `rgba(176,64,48,${pulse})`;
      ctx.font = `bold ${gp * 0.35}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', pcx, pcy - gp * 0.4);
    }
  }

  // Ready glow at entry after first clean
  if (lp.cleanCount >= 1) {
    const fl = currentFloor();
    const ecx = gx + (fl.entry.col + 0.5) * gp;
    const ecy = gy + (fl.entry.row + 0.5) * gp;
    const glow = 0.15 + Math.sin(performance.now() / 500) * 0.1;
    ctx.fillStyle = `rgba(90,106,74,${glow})`;
    ctx.beginPath();
    ctx.arc(ecx, ecy, gp * 0.5, 0, TAU);
    ctx.fill();
  }
}

function buildManifest() {
  const el = document.getElementById('manifest');
  el.innerHTML = '<h3>Manifest</h3>';
  for (const [key, def] of Object.entries(PIN_DEFS)) {
    const remaining = (S.run.manifestSlots[key] || 0) - (S.run.pinsPlaced[key] || 0);
    const slot = document.createElement('div');
    slot.className = 'pin-slot' + (remaining <= 0 ? ' empty' : '');
    slot.innerHTML = `<span class="pin-emoji">${def.emoji}</span><span>${def.label}</span><span class="pin-count">${remaining > 0 ? 'x' + remaining : '-'}</span>`;
    if (remaining > 0) {
      slot.addEventListener('pointerdown', () => {
        S.ui.selectedPin = key;
        document.querySelectorAll('.pin-slot').forEach(s => s.style.borderColor = '');
        slot.style.borderColor = 'var(--mold)';
      });
    }
    el.appendChild(slot);
  }
}
